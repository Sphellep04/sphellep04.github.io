<style>
:root {
  /* Layout: a pale lilac lab table. The goo lives on one big canvas, a slim tray of colours and tools sits underneath. */
  --bg: #f3eeff;

  --ink: #2b2140;

  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.3 var(--ui); overflow: hidden; overscroll-behavior: none; }
#app { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; }
#goo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.title { position: absolute; left: 16px; top: 12px; pointer-events: none; }
h1 { margin: 0; font: 600 26px/1 var(--ui); }
#hint { margin: 4px 0 0; color: var(--mute); font-size: 14px; transition: opacity 0.8s; }
.tray { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: center; align-items: center; }
button { font: 500 15px/1 var(--ui); color: var(--ink); background: #f4efff; border: 2px solid var(--line); border-radius: 999px; min-height: 40px; padding: 0 16px; cursor: pointer; }
button:hover { background: #ebe3ff; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"], button[aria-checked="true"] { border-color: var(--accent); background: #e6dcff; }
.sw { width: 36px; min-height: 36px; height: 36px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.12); }
.sw.rainbow { background: conic-gradient(#ff5d8f, #ffb627, #3ddc97, #35a7ff, #a66bff, #ff5d8f) !important; }
.sep { width: 2px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.credit { color: var(--mute); font-size: 13px; }
.credit a { color: var(--ink); }

    <div class="title"><h1>Goo Lab</h1><p id="hint">Tap to drop goo. Drag it about. Squash two together to mix them.</p></div>
  </div>
  <div class="tray">
    <div class="row" id="sw" role="radiogroup" aria-label="Goo colour"></div>
    <div class="row">
      <button id="tPull" type="button" role="radio" aria-checked="true">Pull</button>
      <button id="tCut" type="button" role="radio" aria-checked="false">Cut</button>
      <button id="tPop" type="button" role="radio" aria-checked="false" title="Tap a blob to pop it into droplets. Tiny ones just vanish">Pop</button>
      <div class="sep"></div>
      <button id="bZero" type="button" aria-pressed="false">Zero gravity</button>
      <button id="bSticky" type="button" aria-pressed="false" title="Blobs pull towards each other">Sticky</button>
      <button id="bEyes" type="button" aria-pressed="true">Eyes</button>
      <button id="bShake" type="button">Shake</button>
      <button id="bSound" type="button" aria-pressed="true">Sound on</button>
      <button id="bShare" type="button" title="Copy a link to this exact lab">Share</button>
      <button id="bPhoto" type="button" title="Save a picture">Photo</button>
      <button id="bClear" type="button">Clear</button>
    </div>
    <div class="row"><span class="credit">Made by <a href="https://phellep.vercel.app/">Phellep Shapopi</a></span></div>
  </div>

cv.addEventListener('pointerdown', (e) => {

cv.addEventListener('pointermove', (e) => {

function release() {

COLORS.forEach((c, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', c[1]); b.setAttribute('aria-checked', String(i === 0)); b.style.background = c[0];
  b.addEventListener('click', () => { colorIdx = i; [...$('sw').children].forEach((s, k) => s.setAttribute('aria-checked', String(k === i))); });

{ const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'sw rainbow'; rb.setAttribute('role', 'radio'); rb.setAttribute('aria-label', 'Rainbow, a random colour each time'); rb.setAttribute('aria-checked', 'false');
  rb.addEventListener('click', () => { colorIdx = 6; [...$('sw').children].forEach((s, k) => s.setAttribute('aria-checked', String(k === 6))); });

function setTool(t) { tool = t; $('tPop').setAttribute('aria-checked', String(t === 'pop')); $('tPull').setAttribute('aria-checked', String(t === 'pull')); $('tCut').setAttribute('aria-checked', String(t === 'cut')); cv.style.cursor = t === 'cut' ? 'crosshair' : t === 'pop' ? 'pointer' : 'grab'; if (t === 'pop') { $('hint').textContent = 'Tap a blob to pop it into droplets. Tiny ones just vanish.'; $('hint').style.opacity = 1; clearTimeout(hintT); hintT = setTimeout(() => { $('hint').style.opacity = 0; }, 4000); } if (t === 'cut') { $('hint').textContent = 'Swipe across a blob to slice it in two.'; $('hint').style.opacity = 1; clearTimeout(hintT); hintT = setTimeout(() => { $('hint').style.opacity = 0; }, 4000); } }
$('tPull').addEventListener('click', () => setTool('pull')); $('tCut').addEventListener('click', () => setTool('cut')); $('tPop').addEventListener('click', () => setTool('pop'));
$('bZero').addEventListener('click', (e) => { wake(); zero = !zero; sfx.whoosh(zero); e.currentTarget.setAttribute('aria-pressed', String(zero)); blobs.forEach((b) => { b.vx += (rnd() - 0.5) * U * 0.3; b.vy -= rnd() * U * 0.25; }); });
$('bEyes').addEventListener('click', (e) => { eyes = !eyes; e.currentTarget.setAttribute('aria-pressed', String(eyes)); });
$('bShake').addEventListener('click', () => { wake(); sfx.shake(); const k = reduce ? 0.5 : 1; blobs.forEach((b) => { b.vx += (rnd() - 0.5) * U * 2.2 * k; b.vy -= U * (0.6 + rnd() * 1.4) * k; }); });

$('bSticky').addEventListener('click', (e) => { wake(); sticky = !sticky; e.currentTarget.setAttribute('aria-pressed', String(sticky)); sfx.tick(); say(sticky ? 'Sticky on. Goo pulls towards other goo.' : 'Sticky off.', 3000); });
function syncSoundBtn() { const on = soundOn(); $('bSound').setAttribute('aria-pressed', String(on)); $('bSound').textContent = on ? 'Sound on' : 'Sound off'; }
$('bSound').addEventListener('click', () => { wake(); if (window.Toybox) Toybox.setSound(!Toybox.sound); syncSoundBtn(); sfx.tick(); });
document.addEventListener('toybox:sound', syncSoundBtn);
function say(t, ms) { const h = $('hint'); h.textContent = t; h.style.opacity = 1; clearTimeout(hintT); if (ms) hintT = setTimeout(() => { h.style.opacity = 0; }, ms); }
/* saving and sharing: positions are stored as fractions so any screen size can load them */
function serialise() { return blobs.slice(0, MAX).map((b) => [Math.round(b.x / W * 1000), Math.round(b.y / H * 1000), Math.round(b.r / U * 1000), Math.round(b.c[0]), Math.round(b.c[1]), Math.round(b.c[2])]); }
function hydrate(list) {
  if (!Array.isArray(list)) return 0; let n = 0;
  for (const q of list.slice(0, MAX)) {
    if (!Array.isArray(q) || q.length < 6 || !q.every(isFinite)) continue;
    const r = clamp(q[2] / 1000 * U, U * 0.02, U * 0.13);
    if (add(clamp(q[0] / 1000 * W, r, W - r), clamp(q[1] / 1000 * H, r, H - r), r, [q[3], q[4], q[5]].map((v) => clamp(v, 0, 255)))) n++;

function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(serialise())); } catch (e) {} }, 400); }
window.addEventListener('pagehide', () => { try { localStorage.setItem(KEY, JSON.stringify(serialise())); } catch (e) {} });
$('bShare').addEventListener('click', async () => {
  if (!blobs.length) { say('Drop some goo first, then share your lab.', 3500); return; }
  const url = location.href.split('#')[0] + '#g=' + b64.enc(JSON.stringify({ v: 1, b: serialise() }));
  try { if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) { await navigator.share({ title: 'Goo Lab', text: 'Look at my goo', url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); say('Link copied. Anyone who opens it sees your goo.', 4000); } catch (e) { say(url, 0); }
});
$('bPhoto').addEventListener('click', () => {
  wake();
  try {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const x = c.getContext('2d'); x.drawImage(cv, 0, 0);
    const k = c.width / Math.max(1, W); x.textAlign = 'right'; x.fillStyle = 'rgba(43,33,64,0.6)'; x.font = '600 ' + Math.round(18 * k) + 'px "Fredoka", sans-serif'; x.fillText('Goo Lab', c.width - 16 * k, 32 * k);

      const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'goo-lab.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
      say('Saved as goo-lab.png. Check your downloads.', 4000);

/* ---------- loop ---------- */
function seed() {
  const cols = [0, 3, 1, 2, 4, 5, 0, 3];
  cols.forEach((c, i) => add(W * (0.18 + 0.64 * ((i * 0.618) % 1)), -U * 0.1 - i * U * 0.14, newR(), rgb(COLORS[c][0]), (rnd() - 0.5) * 60, 0));
}
function resize() {

  const nw = Math.round(r.width), nh = Math.round(r.height); if (nw === W && nh === H && gc) return;

function frame(ts) {

{ let ok = 0;
  try { const m = /^#g=([A-Za-z0-9_-]+)$/.exec(location.hash || ''); if (m) { const d = JSON.parse(b64.dec(m[1])); if (d && d.v === 1) { ok = hydrate(d.b); if (ok) say('You opened a shared lab. Poke the goo.', 5000); } } } catch (e) { blobs = []; }
  if (!ok) { try { ok = hydrate(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { ok = 0; } }
