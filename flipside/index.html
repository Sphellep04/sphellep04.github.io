<style>
:root {
  /* Layout: the whole screen is the game. A slim credit line and a sound switch sit over the edges. */
  --bg: #1b1147;
  --ink: #f4eeff;
  --mute: #a99bd6;
  --accent: #ff5da2;
  --ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.3 var(--ui); overflow: hidden; overscroll-behavior: none; }
#app { position: relative; height: 100%; background: var(--bg); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.hud { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.score { font: 600 34px/1 var(--ui); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
.score small { display: block; margin-top: 4px; font: 500 14px/1 var(--ui); color: var(--mute); }
#snd { pointer-events: auto; font: 500 14px/1 var(--ui); color: var(--ink); background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; }
#snd:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.credit { position: absolute; left: 0; right: 0; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 13px; color: var(--mute); pointer-events: none; }
.credit a { color: var(--ink); pointer-events: auto; }
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 24px; pointer-events: none; }
.panel h1 { margin: 0; font: 600 clamp(44px, 12vw, 84px)/1 var(--ui); letter-spacing: 0.01em; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
.panel p { margin: 0; color: var(--mute); font-size: 18px; max-width: 30ch; }
.panel .big { color: var(--ink); font: 600 28px/1.1 var(--ui); }
.btn { margin-top: 8px; padding: 12px 28px; border-radius: 999px; background: var(--accent); color: #fff; font: 600 20px/1 var(--ui); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
#skins { position: absolute; left: 0; right: 0; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
#skins .row { display: flex; gap: 10px; pointer-events: auto; }

#skins button[aria-pressed="true"] { border-color: #fff; transform: translateY(-2px); }
#skins button.locked { background: #2a1d5a !important; color: var(--mute); }

</style>

<body>
<main id="app">
  <canvas id="game" aria-label="Flipside, a one tap runner. Tap, click or press Space to flip gravity and dodge the spikes."></canvas>
  <div class="hud">
    <div class="score"><span id="sc">0</span><small id="sub">best 0</small></div>
    <button id="snd" type="button" aria-pressed="true">Sound on</button>
  </div>
  <div class="panel" id="pReady">
    <h1>Flipside</h1>
    <p>Tap, click or press Space to flip gravity. Dodge the spikes, grab the stars.</p>
    <p id="ghostNote" hidden>A ghost of your best run will race you.</p>
    <span class="btn">Tap to start</span>
  </div>
  <div class="panel" id="pOver" hidden>
    <p class="big">Ouch!</p>
    <h1 id="oScore">0 pts</h1>
    <p id="oSub">Best 0</p>
    <span class="btn">Tap to try again</span>
  </div>
  <div id="skins" hidden><div class="row" id="skinRow" role="group" aria-label="Choose a blob skin"></div><div class="note" id="skinNote"></div></div>
  <div class="credit">Made by <a href="https://phellep.vercel.app/">Phellep Shapopi</a></div>
</main>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('game'), g = cv.getContext('2d');
const TAU = Math.PI * 2, rnd = Math.random;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const KEY = 'flipside.best';
let W = 1, H = 1, dpr = 1, U = 1, ceilY = 0, floorY = 0, ch = 1, pr = 16;
let state = 'ready', time = 0, lastT = 0, over = 0, shake = 0;
let dist = 0, stars = 0, speed = 0, best = 0, milestone = 0;
let obs = [], items = [], parts = [], popups = [], far = [], nextX = 0;
let sound = window.Toybox ? Toybox.sound : true;
const P = { y: 0, vy: 0, g: 1, ang: 0, grounded: true, sq: 0, blink: 2, eye: 0 };
let countT = 0, goT = 0, runT = 0, recT = 0, rec = [], ghost = null, life = 0, skinId = 'bubblegum';

/* ---------- zones: the look changes as you go further ---------- */
const HEX = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const TKEYS = ['bg0', 'bg1', 'bg2', 'w0', 'w1', 'ceil', 'floor', 'bA', 'bB', 'sA', 'sB'];
const THEMES = [
  { name: 'Dusk', at: 0, hue: 300, bg0: '#2a1266', bg1: '#3c1a72', bg2: '#1b1147', w0: '#0f0a2a', w1: '#241458', ceil: '#4de1ff', floor: '#ff5da2', bA: '#5ce8ff', bB: '#2a8bd6', sA: '#fff1fa', sB: '#ff5da2' },
  { name: 'Neon', at: 250, hue: 165, bg0: '#062a3a', bg1: '#0b4a55', bg2: '#04222e', w0: '#031820', w1: '#0a3a44', ceil: '#7dffb0', floor: '#4de1ff', bA: '#b6ff6a', bB: '#2fbf7a', sA: '#eafff5', sB: '#20d6a0' },
  { name: 'Sunset', at: 600, hue: 30, bg0: '#4a1240', bg1: '#8a2a4a', bg2: '#2a0f30', w0: '#200818', w1: '#4a1430', ceil: '#ffb347', floor: '#ff5d5d', bA: '#ffd166', bB: '#ff7a3d', sA: '#fff3e0', sB: '#ff5d5d' },
  { name: 'Deep space', at: 1000, hue: 220, bg0: '#02030c', bg1: '#0a1030', bg2: '#010208', w0: '#000005', w1: '#0a0f30', ceil: '#a99bff', floor: '#ffffff', bA: '#c9b8ff', bB: '#5b6bd6', sA: '#ffffff', sB: '#7c8cff' }
];
const mkTheme = (t) => { const o = { hue: t.hue }; for (const k of TKEYS) o[k] = HEX(t[k]); return o; };
const TH = THEMES.map(mkTheme), cur = mkTheme(THEMES[0]); let zone = 0;
const rgb = (a) => 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')';
const rgba = (a, al) => 'rgba(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ',' + al + ')';
function blendTheme(dt) { const t = TH[zone], k = Math.min(1, dt * 1.6); for (const key of TKEYS) for (let i = 0; i < 3; i++) cur[key][i] += (t[key][i] - cur[key][i]) * k; cur.hue += (t.hue - cur.hue) * k; }

/* ---------- blob skins, unlocked with stars you collect over all your runs ---------- */
const SKINS = [
  { id: 'bubblegum', name: 'Bubblegum', cost: 0, g: ['#ffb3d6', '#ff5da2', '#c93a7f'], glow: 'rgba(255,93,162,0.6)', trail: '255,150,210' },
  { id: 'mint', name: 'Mint', cost: 20, g: ['#d8fff0', '#3ddc97', '#1a8f63'], glow: 'rgba(61,220,151,0.6)', trail: '140,255,200' },
  { id: 'sunny', name: 'Sunny', cost: 60, g: ['#fff2b0', '#ffc93d', '#d98a00'], glow: 'rgba(255,201,61,0.6)', trail: '255,225,120' },
  { id: 'ghost', name: 'Ghost', cost: 120, g: ['#ffffff', '#cfd6ff', '#8f9ad6'], glow: 'rgba(207,214,255,0.7)', trail: '220,225,255' },
  { id: 'galaxy', name: 'Galaxy', cost: 250, g: ['#c9b8ff', '#6a4bd6', '#2a1a80'], glow: 'rgba(140,110,255,0.7)', trail: '180,150,255', dots: true }
];
const skin = () => SKINS.find((k) => k.id === skinId) || SKINS[0];
try { life = +(localStorage.getItem('flipside.stars') || 0) || 0; const sid = localStorage.getItem('flipside.skin'); if (sid) skinId = sid; } catch (e) {}
if (!SKINS.some((k) => k.id === skinId && k.cost <= life)) skinId = 'bubblegum';
try { const gj = JSON.parse(localStorage.getItem('flipside.ghost') || 'null'); if (gj && Array.isArray(gj.y) && gj.y.length > 4 && +gj.d > 0) ghost = gj; } catch (e) {}
const saveLife = (n) => { try { localStorage.setItem('flipside.stars', String(n)); } catch (e) {} };
function renderSkins() {
  const row = $('skinRow'); row.innerHTML = '';
  for (const k of SKINS) {
    const b = document.createElement('button'), open = k.cost <= life; b.type = 'button';
    b.style.background = 'radial-gradient(circle at 35% 30%, ' + k.g[0] + ', ' + k.g[1] + ' 55%, ' + k.g[2] + ')';
    b.setAttribute('aria-pressed', String(open && k.id === skinId));
    b.setAttribute('aria-label', open ? k.name + ' skin' : k.name + ' skin, locked, needs ' + k.cost + ' stars');
    if (!open) { b.classList.add('locked'); b.textContent = k.cost + '\u2605'; }
    b.addEventListener('click', () => {
      if (!open) { if (window.Toybox) Toybox.toast('Collect ' + (k.cost - life) + ' more stars to unlock ' + k.name); return; }
      skinId = k.id; try { localStorage.setItem('flipside.skin', skinId); } catch (e) {} tone(660, 880, 0.08, 'triangle', 0.18); renderSkins();
    });
    row.appendChild(b);
  }
  const next = SKINS.find((k) => k.cost > life);
  $('skinNote').textContent = next ? '\u2605 ' + life + ' collected. Next skin at ' + next.cost + '.' : '\u2605 ' + life + ' collected. Every skin unlocked!';
  $('skins').hidden = !(state === 'ready' || state === 'dead');
  $('ghostNote').hidden = !ghost;
}
try { best = +(localStorage.getItem(KEY) || 0) || 0; } catch (e) {}

/* ---------- audio ---------- */
let ac = null, master = null, nbuf = null;
function audio() {
  if (ac || !sound) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination); nbuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; } catch (e) { ac = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!sound || !ac) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, hp) {
  if (!sound || !ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  s.buffer = nbuf; f.type = 'lowpass'; f.frequency.value = hp; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(gn); gn.connect(master); s.start(t); s.stop(t + dur);
}
const sFlip = () => tone(320, 760, 0.1, 'triangle', 0.22);
const sStar = () => { tone(880, 880, 0.12, 'sine', 0.2); tone(1320, 1320, 0.16, 'sine', 0.18, 0.07); };
const sDie = () => { noise(0.35, 0.5, 900); tone(220, 50, 0.4, 'sawtooth', 0.25); };
const sLand = () => noise(0.05, 0.12, 700);

/* ---------- layout ---------- */
function resize() {
  const r = cv.getBoundingClientRect(); if (r.width < 10) return;
  const nw = Math.round(r.width), nh = Math.round(r.height); if (nw === W && nh === H) return;
  W = nw; H = nh; dpr = Math.min(2, window.devicePixelRatio || 1); U = Math.min(W, H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const mid = H * 0.5, half = clamp(H * 0.27, 110, 210); ceilY = mid - half; floorY = mid + half; ch = floorY - ceilY; pr = ch * 0.075;
  if (!far.length) for (let i = 0; i < 14; i++) far.push({ x: rnd() * W * 1.3, y: rnd(), r: 0.4 + rnd() * 1.2, z: 0.15 + rnd() * 0.5, h: rnd() });
  if (state === 'ready') reset();
}
const surface = (dir) => (dir > 0 ? floorY - pr : ceilY + pr);

/* ---------- game flow ---------- */
function reset() {
  obs = []; items = []; parts = []; popups = []; dist = 0; stars = 0; milestone = 0; zone = 0; speed = U * 0.62; nextX = W * 0.9 + 400; over = 0; shake = 0;
  P.g = 1; P.y = surface(1); P.vy = 0; P.ang = 0; P.grounded = true; P.sq = 0;
  spawnAhead();
}
function start() { audio(); if (ac && ac.state === 'suspended') ac.resume(); reset(); state = 'count'; countT = 0; goT = 0; runT = 0; recT = 0; rec = []; $('pReady').hidden = true; $('pOver').hidden = true; $('skins').hidden = true; tone(392, 392, 0.14, 'triangle', 0.2); }
function flip() {
  if (state === 'ready' || (state === 'dead' && over > 0.45)) { start(); return; }
  if (state !== 'play') return;
  P.g = -P.g; P.grounded = false; P.vy += P.g * ch * 1.1; P.sq = -0.22; sFlip();
  for (let i = 0; i < 6; i++) parts.push({ x: px(), y: P.y, vx: -speed * 0.3 - rnd() * 80, vy: (rnd() - 0.5) * 120, t: 0, life: 0.4, r: 2 + rnd() * 3, c: '#ffd0ea' });
}
function die() {
  state = 'dead'; over = 0; shake = (window.Toybox && Toybox.reduced) ? 0 : 14; sDie();
  for (let i = 0; i < 26; i++) { const a = rnd() * TAU, s = 80 + rnd() * 420; parts.push({ x: px(), y: P.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.9 + rnd() * 0.5, r: 3 + rnd() * 6, c: rnd() < 0.7 ? '#ff5da2' : '#ffd0ea', grav: 900 }); }
  const m = Math.floor(dist / U * 10) + stars * 10; if (window.Toybox) Toybox.setResult('Flipside', m); let nb = false; if (m > best) { best = m; nb = true; try { localStorage.setItem(KEY, String(best)); } catch (e) {} if (rec.length > 4) { ghost = { d: Math.floor(dist / U * 10), y: rec.slice(0, 3600) }; try { localStorage.setItem('flipside.ghost', JSON.stringify(ghost)); } catch (e) {} } }
  life += stars; saveLife(life); renderSkins();
  $('oScore').textContent = m + ' pts'; $('oSub').textContent = nb ? 'New best!' : 'Best ' + best; $('pOver').hidden = false;
}
const px = () => W * 0.22;

/* ---------- obstacles ---------- */
function spawnAhead() {
  let last = obs.length ? obs[obs.length - 1] : null, lastSide = last ? last.side : 1;
  while (nextX < W + 700) {
    const flipSide = rnd() < 0.62, side = flipSide ? -lastSide : lastSide;
    const gapMin = speed * 0.52 + pr * 2.5, gap = gapMin + rnd() * speed * 0.55;
    const x = nextX + (last ? gap : 0), spike = rnd() < 0.72;
    let o;
    if (spike) { const n = 1 + Math.floor(rnd() * 3); o = { side, kind: 'spike', n, x, w: n * pr * 1.15, h: pr * 1.25 }; }
    else { const bh = ch * (0.28 + rnd() * 0.12); o = { side, kind: 'block', x, w: pr * (1.4 + rnd() * 0.8), h: bh }; }
    obs.push(o); last = o; lastSide = side; nextX = x + o.w;
    if (rnd() < 0.7) { const sx = x + o.w + speed * 0.28 + rnd() * speed * 0.2; items.push({ x: sx, y: rnd() < 0.7 ? surface(-side) : (ceilY + floorY) / 2, r: pr * 0.6, got: false, ph: rnd() * TAU }); }
  }
}
function hitObstacle(o) {
  const cx = px(), cy = P.y, r = pr * 0.78;
  if (o.kind === 'block') {
    const y0 = o.side > 0 ? floorY - o.h : ceilY, y1 = o.side > 0 ? floorY : ceilY + o.h;
    const qx = clamp(cx, o.x, o.x + o.w), qy = clamp(cy, y0, y1); return Math.hypot(cx - qx, cy - qy) < r;
  }
  const sw = o.w / o.n, base = o.side > 0 ? floorY : ceilY, tip = o.side > 0 ? floorY - o.h : ceilY + o.h;
  for (let i = 0; i < o.n; i++) {
    const ax = o.x + i * sw, bx = ax + sw, mx = ax + sw / 2;
    if (cx < ax - r || cx > bx + r) continue;
    const e = [[ax, base, mx, tip], [mx, tip, bx, base]];
    for (const s of e) {
      const dx = s[2] - s[0], dy = s[3] - s[1], t = clamp(((cx - s[0]) * dx + (cy - s[1]) * dy) / (dx * dx + dy * dy), 0, 1);
      if (Math.hypot(cx - (s[0] + dx * t), cy - (s[1] + dy * t)) < r * 0.85) return true;
    }
    if (cx > ax && cx < bx && ((o.side > 0 && cy > base - o.h * ((cx < mx ? cx - ax : bx - cx) / (sw / 2)) - r * 0.4) || (o.side < 0 && cy < base + o.h * ((cx < mx ? cx - ax : bx - cx) / (sw / 2)) + r * 0.4))) return true;
  }
  return false;
}

/* ---------- update ---------- */
function update(dt) {
  time += dt; over += dt; shake *= Math.pow(0.001, dt); blendTheme(dt); if (goT > 0) goT -= dt;
  if (state === 'count') {
    const prev = Math.floor(countT / 0.45); countT += dt; const b = Math.floor(countT / 0.45);
    if (countT >= 1.35) { state = 'play'; goT = 0.5; tone(784, 1046, 0.3, 'triangle', 0.24); }
    else if (b !== prev) tone(b === 1 ? 440 : 523, b === 1 ? 440 : 523, 0.14, 'triangle', 0.2);
  }
  const play = state === 'play';
  if (play) { runT += dt; recT += dt; while (recT >= 0.05) { recT -= 0.05; rec.push(Math.round(clamp((P.y - ceilY) / ch, 0, 1) * 1000)); } }
  const sp = play ? U * 0.62 + Math.min(U * 0.78, dist / U * 0.009 * U) : ((state === 'ready' || state === 'count') ? U * 0.25 : 0);
  speed += (sp - speed) * Math.min(1, dt * 3);
  const dx = speed * dt; if (play) dist += dx;
  far.forEach((s) => { s.x -= dx * s.z; if (s.x < -40) { s.x = W + 40; s.y = rnd(); } });
  P.blink -= dt; if (P.blink < -0.12) P.blink = 2 + rnd() * 3;
  if (state !== 'dead') {
    const D = ch - 2 * pr, a = 22 * D;
    if (!P.grounded) {
      P.vy += P.g * a * dt; P.y += P.vy * dt;
      const s = surface(P.g);
      if ((P.g > 0 && P.y >= s) || (P.g < 0 && P.y <= s)) { P.y = s; P.vy = 0; P.grounded = true; P.sq = 0.28; sLand(); for (let i = 0; i < 6; i++) parts.push({ x: px(), y: s + P.g * pr, vx: -speed * 0.4 - rnd() * 140, vy: -P.g * (30 + rnd() * 120), t: 0, life: 0.4, r: 2 + rnd() * 3, c: '#c9b8ff' }); }
    } else P.y = surface(P.g);
    P.ang += ((P.g > 0 ? 0 : Math.PI) - P.ang) * Math.min(1, dt * 16);
    P.sq += (0 - P.sq) * Math.min(1, dt * 12);
    P.eye = P.g;
  }
  if (play) {
    for (const o of obs) o.x -= dx; for (const it of items) it.x -= dx; nextX -= dx;
    obs = obs.filter((o) => o.x + o.w > -60); items = items.filter((it) => it.x > -60 && !it.got);
    spawnAhead();
    for (const o of obs) if (o.x < px() + pr * 2 && o.x + o.w > px() - pr * 2 && hitObstacle(o)) { die(); break; }
    if (state === 'play') for (const it of items) if (Math.hypot(it.x - px(), it.y - P.y) < it.r + pr * 0.9) { it.got = true; stars++; sStar(); saveLife(life + stars); for (const k of SKINS) if (k.cost > 0 && k.cost === life + stars) { popups.push({ x: W * 0.5, y: ceilY - 30, t: 0, s: k.name + ' skin unlocked!', big: true }); tone(660, 1320, 0.3, 'triangle', 0.22); } popups.push({ x: it.x, y: it.y, t: 0, s: '+10' }); for (let i = 0; i < 10; i++) { const a = rnd() * TAU; parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, t: 0, life: 0.5, r: 3, c: '#ffd166' }); } }
    const m = Math.floor(dist / U * 10); if (m >= milestone + 100) { milestone = m - (m % 100); tone(660, 990, 0.18, 'triangle', 0.18); popups.push({ x: W * 0.5, y: ceilY - 30, t: 0, s: milestone + ' m!', big: true }); }
    let z = 0; for (let i = THEMES.length - 1; i >= 0; i--) if (m >= THEMES[i].at) { z = i; break; }
    if (z > zone) { zone = z; popups.push({ x: W * 0.5, y: ceilY + 46, t: 0, s: THEMES[z].name + ' zone', big: true }); tone(523, 1046, 0.35, 'triangle', 0.2); tone(659, 1318, 0.35, 'triangle', 0.16, 0.08); }
    if (Math.random() < dt * 30) parts.push({ x: px() - pr, y: P.y + (rnd() - 0.5) * pr, vx: -speed * 0.5, vy: (rnd() - 0.5) * 30, t: 0, life: 0.35, r: 2 + rnd() * 2, c: 'rgba(' + skin().trail + ',0.8)' });
  } else if (state === 'ready') {
    if (Math.random() < dt * 20) parts.push({ x: px() - pr, y: P.y, vx: -speed * 0.5, vy: (rnd() - 0.5) * 20, t: 0, life: 0.35, r: 2, c: 'rgba(' + skin().trail + ',0.6)' });
  }
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grav) p.vy += p.grav * dt; }
  parts = parts.filter((p) => p.t < p.life);
  for (const q of popups) q.t += dt; popups = popups.filter((q) => q.t < 0.9);
  const m = Math.floor(dist / U * 10); $('sc').textContent = m + stars * 10; $('sub').textContent = 'best ' + best + ' · ★ ' + stars;
}

/* ---------- drawing ---------- */
function starPath(x, y, r, rot) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }
function draw() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sx = shake > 0.3 ? (rnd() - 0.5) * shake : 0, sy = shake > 0.3 ? (rnd() - 0.5) * shake : 0; g.translate(sx, sy);
  const bgr = g.createLinearGradient(0, 0, 0, H); bgr.addColorStop(0, rgb(cur.bg0)); bgr.addColorStop(0.5, rgb(cur.bg1)); bgr.addColorStop(1, rgb(cur.bg2));
  g.fillStyle = bgr; g.fillRect(-20, -20, W + 40, H + 40);
  for (const s of far) { g.fillStyle = 'hsla(' + (cur.hue + s.h * 60) + ',80%,80%,' + (0.2 + s.z * 0.5) + ')'; g.beginPath(); g.arc(s.x, s.y * H, s.r * 2.2, 0, TAU); g.fill(); }
  // moving stripes give a sense of speed
  g.fillStyle = 'rgba(255,255,255,0.04)'; const off = (dist * 0.6) % 160;
  for (let x = -off; x < W; x += 160) { g.beginPath(); g.moveTo(x, ceilY); g.lineTo(x + 60, ceilY); g.lineTo(x + 10, floorY); g.lineTo(x - 50, floorY); g.fill(); }
  // walls
  const wallGrad = (y0, y1) => { const q = g.createLinearGradient(0, y0, 0, y1); q.addColorStop(0, rgb(cur.w0)); q.addColorStop(1, rgb(cur.w1)); return q; };
  g.fillStyle = wallGrad(0, ceilY); g.fillRect(-20, -20, W + 40, ceilY + 20);
  g.fillStyle = wallGrad(H, floorY); g.fillRect(-20, floorY, W + 40, H - floorY + 20);
  g.fillStyle = rgb(cur.ceil); g.fillRect(-20, ceilY - 4, W + 40, 4); g.fillStyle = rgb(cur.floor); g.fillRect(-20, floorY, W + 40, 4);
  g.fillStyle = rgba(cur.ceil, 0.16); g.fillRect(-20, ceilY, W + 40, 10); g.fillStyle = rgba(cur.floor, 0.16); g.fillRect(-20, floorY - 10, W + 40, 10);
  // obstacles
  for (const o of obs) {
    if (o.kind === 'block') {
      const y0 = o.side > 0 ? floorY - o.h : ceilY, gr = g.createLinearGradient(o.x, 0, o.x + o.w, 0); gr.addColorStop(0, rgb(cur.bA)); gr.addColorStop(1, rgb(cur.bB));
      g.fillStyle = gr; g.beginPath(); g.roundRect ? g.roundRect(o.x, y0, o.w, o.h, 6) : g.rect(o.x, y0, o.w, o.h); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(o.x + 4, y0 + 4, 4, o.h - 8);
    } else {
      const sw = o.w / o.n, base = o.side > 0 ? floorY : ceilY, tip = o.side > 0 ? floorY - o.h : ceilY + o.h;
      for (let i = 0; i < o.n; i++) {
        const ax = o.x + i * sw; g.fillStyle = rgb(cur.sA); g.beginPath(); g.moveTo(ax, base); g.lineTo(ax + sw / 2, tip); g.lineTo(ax + sw, base); g.closePath(); g.fill();
        g.fillStyle = rgb(cur.sB); g.beginPath(); g.moveTo(ax + sw / 2, tip); g.lineTo(ax + sw, base); g.lineTo(ax + sw / 2, base); g.closePath(); g.fill();
      }
    }
  }
  // stars
  for (const it of items) { const bob = Math.sin(time * 4 + it.ph) * 3; g.save(); g.shadowColor = 'rgba(255,209,102,0.9)'; g.shadowBlur = 14; g.fillStyle = '#ffd166'; starPath(it.x, it.y + bob, it.r, time * 1.5 + it.ph); g.fill(); g.restore(); }
  for (const p of parts) { const a = 1 - p.t / p.life; g.globalAlpha = Math.max(0, a); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r * (0.4 + 0.6 * a), 0, TAU); g.fill(); } g.globalAlpha = 1;
  if (ghost && state === 'play') {
    const gx = px() + (ghost.d - dist / U * 10) * U / 10;
    if (gx > -10 && gx < W + 10) { g.save(); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2; g.setLineDash([8, 8]); g.beginPath(); g.moveTo(gx, ceilY); g.lineTo(gx, floorY); g.stroke(); g.setLineDash([]); g.fillStyle = 'rgba(255,255,255,0.85)'; g.font = '600 14px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillText('BEST ' + ghost.d + ' m', gx, ceilY + 24); g.restore(); }
    const gi = runT / 0.05;
    if (gi < ghost.y.length - 1) { const i0 = Math.floor(gi), f = gi - i0, gy = ceilY + (ghost.y[i0] + (ghost.y[i0 + 1] - ghost.y[i0]) * f) / 1000 * ch; g.save(); g.globalAlpha = 0.28; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(px(), gy, pr, 0, TAU); g.fill(); g.globalAlpha = 0.5; g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.stroke(); g.restore(); }
  }
  if (state !== 'dead') drawPlayer();
  if (state === 'count' || goT > 0) {
    const isC = state === 'count', ph = isC ? (countT % 0.45) / 0.45 : 1 - goT / 0.5, rm = window.Toybox && Toybox.reduced;
    const sc = rm ? 1 : (isC ? 1.3 - ph * 0.3 : 1 + ph * 0.5), txt = isC ? String(3 - Math.min(2, Math.floor(countT / 0.45))) : 'GO!';
    g.save(); g.globalAlpha = isC ? 1 - ph * 0.4 : Math.max(0, 1 - ph); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,0.4)'; g.shadowBlur = 0; g.shadowOffsetY = 4; g.font = '600 ' + Math.round(U * 0.2 * sc) + 'px Fredoka, sans-serif'; g.fillText(txt, W / 2, (ceilY + floorY) / 2); g.restore();
  }
  for (const q of popups) { const a = 1 - q.t / 0.9; g.globalAlpha = a; g.fillStyle = q.big ? '#fff' : '#ffd166'; g.font = '600 ' + (q.big ? 34 : 20) + 'px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillText(q.s, q.x, q.y - q.t * 40); g.globalAlpha = 1; }
}
function drawPlayer() {
  const x = px(), y = P.y, sq = P.sq + clamp(Math.abs(P.vy) / (ch * 4), 0, 0.18);
  g.save(); g.translate(x, y); g.rotate(P.ang);
  const stretchV = Math.abs(P.vy) > 1 ? 1 + sq : 1 - Math.abs(P.sq) * 0.6; g.scale(1 + (1 - stretchV) * 0.7, stretchV);
  const gr = g.createRadialGradient(-pr * 0.35, -pr * 0.45, pr * 0.1, 0, 0, pr * 1.1); const sk = skin(); gr.addColorStop(0, sk.g[0]); gr.addColorStop(0.5, sk.g[1]); gr.addColorStop(1, sk.g[2]);
  g.shadowColor = sk.glow; g.shadowBlur = 16; g.fillStyle = gr; g.beginPath(); g.arc(0, 0, pr, 0, TAU); g.fill(); g.shadowBlur = 0;
  if (sk.dots) { g.fillStyle = 'rgba(255,255,255,0.85)'; for (const d of [[0.3, 0.5, 0.07], [-0.1, 0.6, 0.05], [0.55, 0.2, 0.05], [-0.5, 0.35, 0.06]]) { g.beginPath(); g.arc(d[0] * pr, d[1] * pr, d[2] * pr, 0, TAU); g.fill(); } }
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(-pr * 0.38, -pr * 0.42, pr * 0.22, pr * 0.14, -0.6, 0, TAU); g.fill();
  const er = pr * 0.27;
  for (const s of [-1, 1]) {
    const ex = pr * 0.22 + s * pr * 0.34, ey = -pr * 0.05;
    if (P.blink < 0) { g.strokeStyle = '#2b1240'; g.lineWidth = 2; g.beginPath(); g.moveTo(ex - er * 0.7, ey); g.lineTo(ex + er * 0.7, ey); g.stroke(); continue; }
    g.fillStyle = '#fff'; g.beginPath(); g.arc(ex, ey, er, 0, TAU); g.fill(); g.fillStyle = '#2b1240'; g.beginPath(); g.arc(ex + er * 0.3, ey, er * 0.55, 0, TAU); g.fill();
  }
  g.restore();
}

/* ---------- input and loop ---------- */
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); flip(); });
window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) flip(); } });
$('snd').addEventListener('click', (e) => { sound = !sound; e.currentTarget.setAttribute('aria-pressed', String(sound)); e.currentTarget.textContent = sound ? 'Sound on' : 'Sound off'; if (window.Toybox) Toybox.setSound(sound); if (sound) audio(); });
(function () { const b = $('snd'); b.setAttribute('aria-pressed', String(sound)); b.textContent = sound ? 'Sound on' : 'Sound off'; })();
function frame(ts) { const t = ts / 1000; let dt = t - lastT; lastT = t; if (dt > 0.05 || dt <= 0) dt = 0.016; update(dt); draw(); requestAnimationFrame(frame); }
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener('resize', resize);
try { if (location.hash === '#debug') window.__fl = { state: () => state, info: () => ({ dist, stars, speed, obs: obs.length, y: P.y, g: P.g, ceilY, floorY }), obs: () => obs, step: (n) => { for (let i = 0; i < n; i++) update(1 / 60); }, flip, die, godmode: () => { hitObstacle = () => false; }, count: () => countT, zone: () => zone, life: () => life, ghost: () => ghost, skin: () => skinId, setDist: (m) => { dist = m * U / 10; } }; } catch (e) {}
renderSkins();
lastT = performance.now() / 1000; requestAnimationFrame(frame);
})();
</script>
