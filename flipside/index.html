<style>
:root {
  /* Layout: the whole screen is the game. A slim credit line and a sound switch sit over the edges. */
  --bg: #1b1147;
  --ink: #f4eeff;
  --mute: #a99bd6;
  --accent: #ff5da2;
  --ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.3 var(--ui); overflow: hidden; overscroll-behavior: none; }
#app { position: relative; height: 100%; background: var(--bg); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.hud { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.score { font: 600 34px/1 var(--ui); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
.score small { display: block; margin-top: 4px; font: 500 14px/1 var(--ui); color: var(--mute); }
#snd { pointer-events: auto; font: 500 14px/1 var(--ui); color: var(--ink); background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; }
#snd:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.credit { position: absolute; left: 0; right: 0; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 13px; color: var(--mute); pointer-events: none; }
.credit a { color: var(--ink); pointer-events: auto; }
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 24px; pointer-events: none; }
.panel h1 { margin: 0; font: 600 clamp(44px, 12vw, 84px)/1 var(--ui); letter-spacing: 0.01em; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }
.panel p { margin: 0; color: var(--mute); font-size: 18px; max-width: 30ch; }
.panel .big { color: var(--ink); font: 600 28px/1.1 var(--ui); }
.btn { margin-top: 8px; padding: 12px 28px; border-radius: 999px; background: var(--accent); color: #fff; font: 600 20px/1 var(--ui); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }

<body>
<main id="app">
  <canvas id="game" aria-label="Flipside, a one tap runner. Tap, click or press Space to flip gravity and dodge the spikes."></canvas>
  <div class="hud">
    <div class="score"><span id="sc">0</span><small id="sub">best 0</small></div>
    <button id="snd" type="button" aria-pressed="true">Sound on</button>
  </div>
  <div class="panel" id="pReady">
    <h1>Flipside</h1>
    <p>Tap, click or press Space to flip gravity. Dodge the spikes, grab the stars.</p>
    <span class="btn">Tap to start</span>
  </div>
  <div class="panel" id="pOver" hidden>
    <p class="big">Ouch!</p>
    <h1 id="oScore">0 pts</h1>
    <p id="oSub">Best 0</p>
    <span class="btn">Tap to try again</span>
  </div>
  <div class="credit">Made by <a href="https://phellep.vercel.app/">Phellep Shapopi</a></div>
</main>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('game'), g = cv.getContext('2d');
const TAU = Math.PI * 2, rnd = Math.random;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const KEY = 'flipside.best';
let W = 1, H = 1, dpr = 1, U = 1, ceilY = 0, floorY = 0, ch = 1, pr = 16;
let state = 'ready', time = 0, lastT = 0, over = 0, shake = 0;
let dist = 0, stars = 0, speed = 0, best = 0, milestone = 0;
let obs = [], items = [], parts = [], popups = [], far = [], nextX = 0;
let sound = window.Toybox ? Toybox.sound : true;
const P = { y: 0, vy: 0, g: 1, ang: 0, grounded: true, sq: 0, blink: 2, eye: 0 };
try { best = +(localStorage.getItem(KEY) || 0) || 0; } catch (e) {}

/* ---------- audio ---------- */
let ac = null, master = null, nbuf = null;
function audio() {
  if (ac || !sound) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination); nbuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; } catch (e) { ac = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!sound || !ac) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, hp) {
  if (!sound || !ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  s.buffer = nbuf; f.type = 'lowpass'; f.frequency.value = hp; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(gn); gn.connect(master); s.start(t); s.stop(t + dur);
}
const sFlip = () => tone(320, 760, 0.1, 'triangle', 0.22);
const sStar = () => { tone(880, 880, 0.12, 'sine', 0.2); tone(1320, 1320, 0.16, 'sine', 0.18, 0.07); };
const sDie = () => { noise(0.35, 0.5, 900); tone(220, 50, 0.4, 'sawtooth', 0.25); };
const sLand = () => noise(0.05, 0.12, 700);

/* ---------- layout ---------- */
function resize() {
  const r = cv.getBoundingClientRect(); if (r.width < 10) return;
  const nw = Math.round(r.width), nh = Math.round(r.height); if (nw === W && nh === H) return;
  W = nw; H = nh; dpr = Math.min(2, window.devicePixelRatio || 1); U = Math.min(W, H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const mid = H * 0.5, half = clamp(H * 0.27, 110, 210); ceilY = mid - half; floorY = mid + half; ch = floorY - ceilY; pr = ch * 0.075;
  if (!far.length) for (let i = 0; i < 14; i++) far.push({ x: rnd() * W * 1.3, y: rnd(), r: 0.4 + rnd() * 1.2, z: 0.15 + rnd() * 0.5, h: rnd() });
  if (state === 'ready') reset();
}
const surface = (dir) => (dir > 0 ? floorY - pr : ceilY + pr);

/* ---------- game flow ---------- */
function reset() {
  obs = []; items = []; parts = []; popups = []; dist = 0; stars = 0; milestone = 0; speed = U * 0.62; nextX = W * 0.9 + 400; over = 0; shake = 0;
  P.g = 1; P.y = surface(1); P.vy = 0; P.ang = 0; P.grounded = true; P.sq = 0;
  spawnAhead();
}
function start() { audio(); if (ac && ac.state === 'suspended') ac.resume(); reset(); state = 'play'; $('pReady').hidden = true; $('pOver').hidden = true; }
function flip() {
  if (state === 'ready' || (state === 'dead' && over > 0.45)) { start(); return; }
  if (state !== 'play') return;
  P.g = -P.g; P.grounded = false; P.vy += P.g * ch * 1.1; P.sq = -0.22; sFlip();
  for (let i = 0; i < 6; i++) parts.push({ x: px(), y: P.y, vx: -speed * 0.3 - rnd() * 80, vy: (rnd() - 0.5) * 120, t: 0, life: 0.4, r: 2 + rnd() * 3, c: '#ffd0ea' });
}
function die() {
  state = 'dead'; over = 0; shake = (window.Toybox && Toybox.reduced) ? 0 : 14; sDie();
  for (let i = 0; i < 26; i++) { const a = rnd() * TAU, s = 80 + rnd() * 420; parts.push({ x: px(), y: P.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.9 + rnd() * 0.5, r: 3 + rnd() * 6, c: rnd() < 0.7 ? '#ff5da2' : '#ffd0ea', grav: 900 }); }
  const m = Math.floor(dist / U * 10) + stars * 10; if (window.Toybox) Toybox.setResult('Flipside', m); let nb = false; if (m > best) { best = m; nb = true; try { localStorage.setItem(KEY, String(best)); } catch (e) {} }
  $('oScore').textContent = m + ' pts'; $('oSub').textContent = nb ? 'New best!' : 'Best ' + best; $('pOver').hidden = false;
}
const px = () => W * 0.22;

/* ---------- obstacles ---------- */
function spawnAhead() {
  let last = obs.length ? obs[obs.length - 1] : null, lastSide = last ? last.side : 1;
  while (nextX < W + 700) {
    const flipSide = rnd() < 0.62, side = flipSide ? -lastSide : lastSide;
    const gapMin = speed * 0.52 + pr * 2.5, gap = gapMin + rnd() * speed * 0.55;
    const x = nextX + (last ? gap : 0), spike = rnd() < 0.72;
    let o;
    if (spike) { const n = 1 + Math.floor(rnd() * 3); o = { side, kind: 'spike', n, x, w: n * pr * 1.15, h: pr * 1.25 }; }
    else { const bh = ch * (0.28 + rnd() * 0.12); o = { side, kind: 'block', x, w: pr * (1.4 + rnd() * 0.8), h: bh }; }
    obs.push(o); last = o; lastSide = side; nextX = x + o.w;
    if (rnd() < 0.7) { const sx = x + o.w + speed * 0.28 + rnd() * speed * 0.2; items.push({ x: sx, y: rnd() < 0.7 ? surface(-side) : (ceilY + floorY) / 2, r: pr * 0.6, got: false, ph: rnd() * TAU }); }
  }
}
function hitObstacle(o) {
  const cx = px(), cy = P.y, r = pr * 0.78;
  if (o.kind === 'block') {
    const y0 = o.side > 0 ? floorY - o.h : ceilY, y1 = o.side > 0 ? floorY : ceilY + o.h;
    const qx = clamp(cx, o.x, o.x + o.w), qy = clamp(cy, y0, y1); return Math.hypot(cx - qx, cy - qy) < r;
  }
  const sw = o.w / o.n, base = o.side > 0 ? floorY : ceilY, tip = o.side > 0 ? floorY - o.h : ceilY + o.h;
  for (let i = 0; i < o.n; i++) {
    const ax = o.x + i * sw, bx = ax + sw, mx = ax + sw / 2;
    if (cx < ax - r || cx > bx + r) continue;
    const e = [[ax, base, mx, tip], [mx, tip, bx, base]];
    for (const s of e) {
      const dx = s[2] - s[0], dy = s[3] - s[1], t = clamp(((cx - s[0]) * dx + (cy - s[1]) * dy) / (dx * dx + dy * dy), 0, 1);
      if (Math.hypot(cx - (s[0] + dx * t), cy - (s[1] + dy * t)) < r * 0.85) return true;
    }
    if (cx > ax && cx < bx && ((o.side > 0 && cy > base - o.h * ((cx < mx ? cx - ax : bx - cx) / (sw / 2)) - r * 0.4) || (o.side < 0 && cy < base + o.h * ((cx < mx ? cx - ax : bx - cx) / (sw / 2)) + r * 0.4))) return true;
  }
  return false;
}

/* ---------- update ---------- */
function update(dt) {
  time += dt; over += dt; shake *= Math.pow(0.001, dt);
  const play = state === 'play';
  const sp = play ? U * 0.62 + Math.min(U * 0.78, dist / U * 0.009 * U) : (state === 'ready' ? U * 0.25 : 0);
  speed += (sp - speed) * Math.min(1, dt * 3);
  const dx = speed * dt; if (play) dist += dx;
  far.forEach((s) => { s.x -= dx * s.z; if (s.x < -40) { s.x = W + 40; s.y = rnd(); } });
  P.blink -= dt; if (P.blink < -0.12) P.blink = 2 + rnd() * 3;
  if (state !== 'dead') {
    const D = ch - 2 * pr, a = 22 * D;
    if (!P.grounded) {
      P.vy += P.g * a * dt; P.y += P.vy * dt;
      const s = surface(P.g);
      if ((P.g > 0 && P.y >= s) || (P.g < 0 && P.y <= s)) { P.y = s; P.vy = 0; P.grounded = true; P.sq = 0.28; sLand(); for (let i = 0; i < 6; i++) parts.push({ x: px(), y: s + P.g * pr, vx: -speed * 0.4 - rnd() * 140, vy: -P.g * (30 + rnd() * 120), t: 0, life: 0.4, r: 2 + rnd() * 3, c: '#c9b8ff' }); }
    } else P.y = surface(P.g);
    P.ang += ((P.g > 0 ? 0 : Math.PI) - P.ang) * Math.min(1, dt * 16);
    P.sq += (0 - P.sq) * Math.min(1, dt * 12);
    P.eye = P.g;
  }
  if (play) {
    for (const o of obs) o.x -= dx; for (const it of items) it.x -= dx; nextX -= dx;
    obs = obs.filter((o) => o.x + o.w > -60); items = items.filter((it) => it.x > -60 && !it.got);
    spawnAhead();
    for (const o of obs) if (o.x < px() + pr * 2 && o.x + o.w > px() - pr * 2 && hitObstacle(o)) { die(); break; }
    if (state === 'play') for (const it of items) if (Math.hypot(it.x - px(), it.y - P.y) < it.r + pr * 0.9) { it.got = true; stars++; sStar(); popups.push({ x: it.x, y: it.y, t: 0, s: '+10' }); for (let i = 0; i < 10; i++) { const a = rnd() * TAU; parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, t: 0, life: 0.5, r: 3, c: '#ffd166' }); } }
    const m = Math.floor(dist / U * 10); if (m >= milestone + 100) { milestone = m - (m % 100); tone(660, 990, 0.18, 'triangle', 0.18); popups.push({ x: W * 0.5, y: ceilY - 30, t: 0, s: milestone + ' m!', big: true }); }
    if (Math.random() < dt * 30) parts.push({ x: px() - pr, y: P.y + (rnd() - 0.5) * pr, vx: -speed * 0.5, vy: (rnd() - 0.5) * 30, t: 0, life: 0.35, r: 2 + rnd() * 2, c: 'rgba(255,150,210,0.8)' });
  } else if (state === 'ready') {
    if (Math.random() < dt * 20) parts.push({ x: px() - pr, y: P.y, vx: -speed * 0.5, vy: (rnd() - 0.5) * 20, t: 0, life: 0.35, r: 2, c: 'rgba(255,150,210,0.6)' });
  }
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grav) p.vy += p.grav * dt; }
  parts = parts.filter((p) => p.t < p.life);
  for (const q of popups) q.t += dt; popups = popups.filter((q) => q.t < 0.9);
  const m = Math.floor(dist / U * 10); $('sc').textContent = m + stars * 10; $('sub').textContent = 'best ' + best + ' · ★ ' + stars;
}

/* ---------- drawing ---------- */
function starPath(x, y, r, rot) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }
function draw() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sx = shake > 0.3 ? (rnd() - 0.5) * shake : 0, sy = shake > 0.3 ? (rnd() - 0.5) * shake : 0; g.translate(sx, sy);
  const bgr = g.createLinearGradient(0, 0, 0, H); bgr.addColorStop(0, '#2a1266'); bgr.addColorStop(0.5, '#3c1a72'); bgr.addColorStop(1, '#1b1147');
  g.fillStyle = bgr; g.fillRect(-20, -20, W + 40, H + 40);
  for (const s of far) { g.fillStyle = 'hsla(' + (300 + s.h * 60) + ',80%,80%,' + (0.2 + s.z * 0.5) + ')'; g.beginPath(); g.arc(s.x, s.y * H, s.r * 2.2, 0, TAU); g.fill(); }
  // moving stripes give a sense of speed
  g.fillStyle = 'rgba(255,255,255,0.04)'; const off = (dist * 0.6) % 160;
  for (let x = -off; x < W; x += 160) { g.beginPath(); g.moveTo(x, ceilY); g.lineTo(x + 60, ceilY); g.lineTo(x + 10, floorY); g.lineTo(x - 50, floorY); g.fill(); }
  // walls
  const wallGrad = (y0, y1) => { const q = g.createLinearGradient(0, y0, 0, y1); q.addColorStop(0, '#0f0a2a'); q.addColorStop(1, '#241458'); return q; };
  g.fillStyle = wallGrad(0, ceilY); g.fillRect(-20, -20, W + 40, ceilY + 20);
  g.fillStyle = wallGrad(H, floorY); g.fillRect(-20, floorY, W + 40, H - floorY + 20);
  g.fillStyle = '#4de1ff'; g.fillRect(-20, ceilY - 4, W + 40, 4); g.fillStyle = '#ff5da2'; g.fillRect(-20, floorY, W + 40, 4);
  g.fillStyle = 'rgba(77,225,255,0.16)'; g.fillRect(-20, ceilY, W + 40, 10); g.fillStyle = 'rgba(255,93,162,0.16)'; g.fillRect(-20, floorY - 10, W + 40, 10);
  // obstacles
  for (const o of obs) {
    if (o.kind === 'block') {
      const y0 = o.side > 0 ? floorY - o.h : ceilY, gr = g.createLinearGradient(o.x, 0, o.x + o.w, 0); gr.addColorStop(0, '#5ce8ff'); gr.addColorStop(1, '#2a8bd6');
      g.fillStyle = gr; g.beginPath(); g.roundRect ? g.roundRect(o.x, y0, o.w, o.h, 6) : g.rect(o.x, y0, o.w, o.h); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(o.x + 4, y0 + 4, 4, o.h - 8);
    } else {
      const sw = o.w / o.n, base = o.side > 0 ? floorY : ceilY, tip = o.side > 0 ? floorY - o.h : ceilY + o.h;
      for (let i = 0; i < o.n; i++) {
        const ax = o.x + i * sw; g.fillStyle = '#fff1fa'; g.beginPath(); g.moveTo(ax, base); g.lineTo(ax + sw / 2, tip); g.lineTo(ax + sw, base); g.closePath(); g.fill();
        g.fillStyle = '#ff5da2'; g.beginPath(); g.moveTo(ax + sw / 2, tip); g.lineTo(ax + sw, base); g.lineTo(ax + sw / 2, base); g.closePath(); g.fill();

  }

  for (const it of items) { const bob = Math.sin(time * 4 + it.ph) * 3; g.save(); g.shadowColor = 'rgba(255,209,102,0.9)'; g.shadowBlur = 14; g.fillStyle = '#ffd166'; starPath(it.x, it.y + bob, it.r, time * 1.5 + it.ph); g.fill(); g.restore(); }
  for (const p of parts) { const a = 1 - p.t / p.life; g.globalAlpha = Math.max(0, a); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r * (0.4 + 0.6 * a), 0, TAU); g.fill(); } g.globalAlpha = 1;
  if (state !== 'dead') drawPlayer();
  for (const q of popups) { const a = 1 - q.t / 0.9; g.globalAlpha = a; g.fillStyle = q.big ? '#fff' : '#ffd166'; g.font = '600 ' + (q.big ? 34 : 20) + 'px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillText(q.s, q.x, q.y - q.t * 40); g.globalAlpha = 1; }
}
function drawPlayer() {
  const x = px(), y = P.y, sq = P.sq + clamp(Math.abs(P.vy) / (ch * 4), 0, 0.18);
  g.save(); g.translate(x, y); g.rotate(P.ang);
  const stretchV = Math.abs(P.vy) > 1 ? 1 + sq : 1 - Math.abs(P.sq) * 0.6; g.scale(1 + (1 - stretchV) * 0.7, stretchV);
  const gr = g.createRadialGradient(-pr * 0.35, -pr * 0.45, pr * 0.1, 0, 0, pr * 1.1); gr.addColorStop(0, '#ffb3d6'); gr.addColorStop(0.5, '#ff5da2'); gr.addColorStop(1, '#c93a7f');
  g.shadowColor = 'rgba(255,93,162,0.6)'; g.shadowBlur = 16; g.fillStyle = gr; g.beginPath(); g.arc(0, 0, pr, 0, TAU); g.fill(); g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(-pr * 0.38, -pr * 0.42, pr * 0.22, pr * 0.14, -0.6, 0, TAU); g.fill();
  const er = pr * 0.27;
  for (const s of [-1, 1]) {
    const ex = pr * 0.22 + s * pr * 0.34, ey = -pr * 0.05;

  }
  g.restore();
}
