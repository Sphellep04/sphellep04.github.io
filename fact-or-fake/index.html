<style>

  { ch: 'Article', from: 'Breaking news', sub: 'Shared today', text: 'Schools closed tomorrow after a serious incident! The article looks recent, but the date at the top is from three years ago.', a: 'L', flags: ['date at the top is from three years ago'], why: 'Old stories are often shared again as if they are new. Always check the date before you react or share.' },
  { ch: 'Facebook', from: 'Ministry_Of_Health_Official', sub: '40 followers, account made last week, no verification tick', text: 'We are giving cash to every household. Send your name, ID number and phone number in the comments to receive it.', a: 'L', flags: ['40 followers, account made last week', 'Send your name, ID number'], why: 'Copycat accounts pretend to be official bodies. The real page is verified, links to the real website and never asks for your ID in public comments.' },
  { ch: 'WhatsApp forward', from: 'Forwarded many times', text: 'Do not drink Brand X juice! It has poisoned 12 children. Forward to protect your family!', a: 'L', flags: ['poisoned 12 children', 'Forward to protect your family'], why: 'No news outlet, no health authority, no names. Scary claims with no source are made to spread. A real recall is published by the maker and by health authorities.' },
  { ch: 'Post', from: 'MoneyMagic Tips', text: 'This new app pays N$500 per day just for watching videos. Thousands are already earning. Download now!', a: 'L', flags: ['N$500 per day just for watching videos', 'Download now'], why: 'Promises of easy money are a classic trick. Search for independent reviews before you download an app or share your details.' },

  { ch: 'Facebook', from: 'Ministry of Health', sub: 'Verified page with a long history of posts', text: 'A vaccination campaign starts next Monday. The post lists the clinics and dates and links to a page on the ministry\'s own website that says the same.', a: 'R', flags: [], why: 'It comes from a verified page, has specific details and the same information appears on the official website. That is what a trustworthy post looks like.' },
  { ch: 'News', from: 'Three news outlets', text: 'Three different outlets report the same road closure with the same times and diversions. The roads authority page posted a map.', a: 'R', flags: [], why: 'Independent reports agreeing on the details, plus an official source, is strong evidence.' },
  { ch: 'Weather', from: 'National Weather Service', sub: 'Official website and app', text: 'A warning of heavy rain on Thursday for the north. The notice has a time issued, affected areas and safety advice, and local radio repeats it.', a: 'R', flags: [], why: 'It has a clear source, time and place, and radio confirms it. Weather warnings from the official service are worth taking seriously.' },
  { ch: 'University', from: 'Student Affairs', sub: 'Verified page and student portal', text: 'The exam timetable has changed. The full timetable is on the student portal, and the same notice appears on the verified page.', a: 'R', flags: [], why: 'The information is in two official places you can check yourself. That is the safest way to confirm.' },
  { ch: 'Article', from: 'A university study', text: 'A researcher\'s post about water saving links to the full study in a university journal. The numbers in the post match the study.', a: 'R', flags: [], why: 'It links to the primary source and the claims match it. Checking that the numbers match is a great habit.' },
  { ch: 'Newspaper', from: 'A local newspaper', text: 'An article from today names the reporter, quotes named officials and links to the official statement.', a: 'R', flags: [], why: 'A named reporter, a current date, named sources and a link to the statement all make it easy to check.' },
  { ch: 'Fact check', from: 'A fact-checking website', text: 'It explains that a viral photo is from an event five years ago and shows the original photo, its date and the photographer\'s name.', a: 'R', flags: [], why: 'Fact checkers show their evidence so you can check it too. This is a good place to end a debate about a rumour.' },
  { ch: 'School', from: 'The principal', text: 'A message in the class group says school is closed on Friday. The same notice is on the school\'s website and the official parents\' group.', a: 'R', flags: [], why: 'The source is in charge of the information and it is repeated in the school\'s own official places.' },
  { ch: 'Instagram', from: 'A lodge you follow', text: 'A photo of a rainbow over a waterhole, posted with the location and date. Other visitors have posted similar photos the same day.', a: 'R', flags: [], why: 'Context, date and other photos from the same place make this easy to believe. Not every post is a lie.' },
  { ch: 'Video', from: 'A known broadcaster', text: 'A news video shows a reporter on location. The date and place are shown, and there is a link to the full report on the broadcaster\'s site.', a: 'R', flags: [], why: 'A known outlet, a reporter on location and a link to the full story all add trust.' },
  { ch: 'Notice', from: 'Local municipality', sub: 'Official page', text: 'Water will be off in two suburbs on Saturday from 08:00 to 14:00 for repairs. Tankers will be at two marked points.', a: 'R', flags: [], why: 'A clear time, place and plan from the body responsible. Municipalities announce these on their own pages.' },

  { ch: 'WhatsApp forward', from: 'Forwarded many times', text: 'Police warn: a gang in a white bakkie is kidnapping children at malls today. Send to every parent you know.', a: 'L', flags: ['a gang in a white bakkie', 'Send to every parent you know'], why: 'No police station, no case number and no time or place. Panic messages like this spread fast and cause real fear. The police post real warnings on their own verified pages.' },
  { ch: 'Facebook', from: 'Farm Life Namibia', text: 'A viral video shows a huge crocodile in a Windhoek dam. The comments say it is in the news. Nobody links to a news story.', a: 'L', flags: ['huge crocodile in a Windhoek dam', 'Nobody links to a news story'], why: 'Wild claims with "it is in the news" but no actual link are a red flag. Windhoek dams are not home to crocodiles, and the clip could be from anywhere.' },
  { ch: 'Post', from: 'Cheap Data Deals', text: 'Free 10GB for everyone this weekend from your network. Open the link and enter your phone number and PIN to claim.', a: 'L', flags: ['Free 10GB for everyone', 'enter your phone number and PIN'], why: 'Nobody gives away data if you hand over your PIN. This is a way to take over your account or your mobile money wallet.' },
  { ch: 'Tweet', from: 'A screenshot of a tweet', sub: 'Posted by an account with a stolen profile photo', text: 'A famous rugby player "tweeted" that he is retiring today. The screenshot has no link and the account name is slightly different from his real one.', a: 'L', flags: ['screenshot', 'account name is slightly different'], why: 'Fake tweets are easy to make and easy to share. Go to the player\'s real, verified page and see whether it says the same thing.' },
  { ch: 'Article', from: 'Health Truth Daily', text: 'A "study" shows that garlic in your ears prevents all viruses. The article does not say who did the study or where it was published.', a: 'L', flags: ['garlic in your ears prevents all viruses', 'does not say who did the study'], why: 'A real study names the researchers and where it was published. "Prevents all viruses" is far too strong for any single remedy.' },
  { ch: 'Video', from: 'A dramatic clip', sub: 'Caption says: "Namibia today!"', text: 'A video of a huge fire at a factory. The number plates on the cars are from another country and the signs are in a different language.', a: 'L', flags: ['number plates on the cars are from another country', 'signs are in a different language'], why: 'Details in the background often give away where a video really comes from. Look at signs, plates and clothing before you accept a caption.' },
  { ch: 'Facebook', from: 'Community Alert', sub: 'Posted 4 years ago, shared again today', text: 'Beware, the water in our town is contaminated. Do not drink it. Posted with a date that has been cropped out of the screenshot.', a: 'L', flags: ['date that has been cropped out'], why: 'A cropped date is a sign someone does not want you to see how old the post is. Check with your municipality before you panic or share.' },

  { ch: 'Radio', from: 'National broadcaster', text: 'The morning news says a new bus route starts next month. The same route and times are on the city\'s own website, and a councillor is named as the source.', a: 'R', flags: [], why: 'A named source, matching details on an official site and a trusted outlet. Three good signs pointing the same way.' },
  { ch: 'Facebook', from: 'Health Ministry', sub: 'Verified page', text: 'A notice about a measles vaccination drive lists the date, clinic names and a phone number. The same details are on the ministry website.', a: 'R', flags: [], why: 'Specific details, a verified page and an official website that says the same. That is what a reliable health notice looks like.' },
  { ch: 'Article', from: 'A science magazine', text: 'A story about a new desert beetle study names the university, the researchers and links to the paper. The claim in the headline matches what the paper says.', a: 'R', flags: [], why: 'It points to the source and you can check it. The headline also matches the study, which is not always the case.' },
  { ch: 'Photo', from: 'A news agency', sub: 'Caption with photographer, date and place', text: 'A photo of a flooded road in the north is credited to a named photographer, with the date and place in the caption. Two other outlets ran different photos of the same road.', a: 'R', flags: [], why: 'A credit, a date and a place, plus other photos of the same scene from other sources. The photo is easy to verify.' },
  { ch: 'School', from: 'Sports teacher', text: 'A message in the sports group says the athletics day is moved to Saturday because of the heat. The same notice is on the school notice board and website.', a: 'R', flags: [], why: 'The person is in charge and the notice appears in more than one official place. That is the checking you want.' },
  { ch: 'WhatsApp', from: 'A friend you know well', text: 'Your friend sends you a photo of a broken pipe outside their house and asks if you know who to call at the municipality.', a: 'R', flags: [], why: 'It is a personal message from someone you know, about their own situation. It is not a forward and it asks for nothing risky.' },
  { ch: 'Fact check', from: 'A fact-checking site', text: 'It rates a claim that a soft drink dissolves teeth overnight as false and links to a dentist\'s association and a lab test.', a: 'R', flags: [], why: 'It shows the evidence and links to real experts. A good fact check makes it easy for you to verify their work.' }
];

/* Generic swipe deck. Needs CFG and DECK from the toy's own file. */
let deck = [], i = 0, score = 0, streak = 0, answered = false, cur = null, ROUND = CFG.count || CFG.rounds[CFG.rounds.length - 1];
const msg = A.$('msg'), $ = A.$;
const MAXLEN = CFG.count || CFG.rounds[CFG.rounds.length - 1];
$('kick').textContent = CFG.kicker; $('ttl').textContent = CFG.title; $('lede').textContent = CFG.lede; $('how').innerHTML = CFG.how;
$('bLeft').innerHTML = '&larr; ' + A.esc(CFG.leftLabel); $('bRight').innerHTML = A.esc(CFG.rightLabel) + ' &rarr;';
$('bLeft').setAttribute('aria-keyshortcuts', 'ArrowLeft'); $('bRight').setAttribute('aria-keyshortcuts', 'ArrowRight');
$('remember').innerHTML = CFG.remember.map((r) => '<li><b>' + A.esc(r[0]) + '</b> ' + A.esc(r[1]) + '</li>').join('');
if (CFG.foot) { $('foot').innerHTML = CFG.foot; $('foot').hidden = false; }
if (CFG.gloss && CFG.gloss.length && $('glossList')) { $('glossList').innerHTML = CFG.gloss.map((g) => '<dt>' + A.esc(g[0]) + '</dt><dd>' + A.esc(g[1]) + '</dd>').join(''); $('gloss').hidden = false; }
let chosen = +A.store.get('aware.' + CFG.slug + '.len', MAXLEN); if (CFG.rounds.indexOf(chosen) < 0) chosen = MAXLEN;
function drawLens() { $('lens').innerHTML = CFG.rounds.map((n) => '<button type="button" role="radio" data-n="' + n + '" aria-checked="' + (n === chosen) + '">' + n + ' cards' + (n === MAXLEN ? ' (counts for best)' : '') + '</button>').join(''); $('lens').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { chosen = +b.dataset.n; A.store.set('aware.' + CFG.slug + '.len', String(chosen)); drawLens(); })); }
drawLens();
let topic = 'all';
if (CFG.topics && $('topics')) {
  const cnt = (k) => DECK.filter((c) => k === 'all' || c.t === k).length;
  topic = A.store.get('aware.' + CFG.slug + '.topic', 'all'); if (!CFG.topics.some((t) => t[0] === topic)) topic = 'all';
  const drawTopics = () => { $('topics').innerHTML = CFG.topics.map((t) => '<button type="button" role="radio" data-k="' + t[0] + '" aria-checked="' + (t[0] === topic) + '">' + A.esc(t[1]) + ' <small>' + cnt(t[0]) + '</small></button>').join(''); $('topics').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { topic = b.dataset.k; A.store.set('aware.' + CFG.slug + '.topic', topic); drawTopics(); })); };
  drawTopics(); $('topicWrap').hidden = false;
}

function hi(text, flags) { let out = A.esc(text); for (const f of flags || []) { const e = A.esc(f); out = out.split(e).join('<mark>' + e + '</mark>'); } return out; }
function show() {
  cur = deck[i]; answered = false;
  msg.className = 'msg pop'; msg.style.transform = '';
  msg.innerHTML = '<div class="meta"><span>' + A.esc(cur.ch) + '</span><span>Card ' + (i + 1) + '</span></div><div class="from">' + A.esc(cur.from) + '</div>' + (cur.sub ? '<div class="sub">' + A.esc(cur.sub) + '</div>' : '') + '<div class="text">' + A.esc(cur.text) + '</div><span class="verdict"></span>';
  $('why').hidden = true; $('nextRow').hidden = true; $('decide').classList.remove('off');
  $('sN').textContent = i + 1; $('sT').textContent = ROUND; $('sS').textContent = score; $('sK').textContent = streak; $('pBar').style.width = (i / ROUND * 100) + '%';
  msg.focus({ preventScroll: true });
}
function answer(sayLeft) {
  if (answered) return; answered = true;
  const ok = sayLeft === (cur.a === 'L');
  if (ok) { score++; streak++; A.sfx.good(); } else { streak = 0; A.sfx.bad(); }
  msg.classList.add('answered', cur.a === 'L' ? 'isL' : 'isR'); msg.style.transform = ''; msg.classList.remove('left', 'right');
  msg.querySelector('.verdict').textContent = cur.a === 'L' ? CFG.leftWord : CFG.rightWord;
  msg.querySelector('.text').innerHTML = hi(cur.text, cur.flags);
  const w = $('why'); w.className = 'why pop ' + (ok ? 'good' : 'bad');
  w.innerHTML = '<span class="tag">' + (ok ? 'Correct' : 'Not this time') + '</span><p>' + A.esc(cur.why) + '</p>' + (cur.flags && cur.flags.length ? '<p style="color:var(--mute);font-size:14px">Key parts are highlighted on the card.</p>' : '');
  w.hidden = false; $('decide').classList.add('off'); $('nextRow').hidden = false;
  $('bNext').textContent = i + 1 >= ROUND ? 'See my result' : 'Next card';
  $('sS').textContent = score; $('sK').textContent = streak; $('pBar').style.width = ((i + 1) / ROUND * 100) + '%';
  $('bNext').focus({ preventScroll: true });
}
function next() { if (!answered) return; i++; if (i >= ROUND) return finish(); show(); window.scrollTo({ top: 0, behavior: A.reduced() ? 'auto' : 'smooth' }); }
function finish() {
  document.body.classList.remove('playing'); $('play').hidden = true; $('end').hidden = false;
  const full = ROUND === MAXLEN && topic === 'all', isBest = full && A.saveBest(CFG.slug, score), n = A.plays(CFG.slug);
  $('eScore').textContent = score + '/' + ROUND;
  const pct = score / ROUND; let rank = CFG.ranks[CFG.ranks.length - 1][1]; for (const r of CFG.ranks) if (pct >= r[0]) { rank = r[1]; break; }
  $('eRank').textContent = rank;
  $('eBest').textContent = full ? ((isBest && n > 1 ? 'New best. ' : '') + 'Your best is ' + A.best(CFG.slug) + '/' + MAXLEN + '.') : 'Short and single-topic rounds do not count towards your best. Try the full mixed round.';
  if (window.Toybox) Toybox.setResult(CFG.title, score + '/' + ROUND);
  A.sfx.done(); window.scrollTo(0, 0);
}
function start() {
  ROUND = chosen; const pool = DECK.filter((c) => topic === 'all' || c.t === topic), L = A.shuffle(pool.filter((c) => c.a === 'L')), R = A.shuffle(pool.filter((c) => c.a === 'R'));
  let nl = Math.min(L.length, Math.round(ROUND * (CFG.leftShare || 0.5))), nr = Math.min(R.length, ROUND - nl);
  if (nl + nr < ROUND) nl = Math.min(L.length, ROUND - nr);
  deck = A.shuffle(L.slice(0, nl).concat(R.slice(0, nr))); ROUND = deck.length; i = 0; score = 0; streak = 0;
  document.body.classList.add('playing'); $('intro').hidden = true; $('end').hidden = true; $('play').hidden = false; show(); A.audio();
}
$('bStart').addEventListener('click', start); $('bAgain').addEventListener('click', () => { $('end').hidden = true; $('intro').hidden = false; window.scrollTo(0, 0); refreshBest(); });
$('bLeft').addEventListener('click', () => answer(true)); $('bRight').addEventListener('click', () => answer(false)); $('bNext').addEventListener('click', next);
$('bShare').addEventListener('click', () => window.Toybox && Toybox.share());
document.addEventListener('keydown', (e) => {
  if ($('play').hidden) return; const k = e.key.toLowerCase();
  if (e.key === 'ArrowLeft' || k === CFG.keyL) answer(true); else if (e.key === 'ArrowRight' || k === CFG.keyR) answer(false);
  else if ((e.key === 'Enter' || e.key === ' ') && answered && document.activeElement !== $('bNext')) { e.preventDefault(); next(); }
});
let sx = null, dx = 0;
msg.addEventListener('pointerdown', (e) => { if (answered) return; sx = e.clientX; dx = 0; msg.classList.add('drag'); try { msg.setPointerCapture(e.pointerId); } catch (x) {} });
msg.addEventListener('pointermove', (e) => { if (sx === null) return; dx = e.clientX - sx; msg.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 25 + 'deg)'; msg.classList.toggle('left', dx < -30); msg.classList.toggle('right', dx > 30); });
function endDrag() { if (sx === null) return; sx = null; msg.classList.remove('drag'); if (dx < -80) answer(true); else if (dx > 80) answer(false); else { msg.style.transform = ''; msg.classList.remove('left', 'right'); } dx = 0; }
msg.addEventListener('pointerup', endDrag); msg.addEventListener('pointercancel', endDrag);
function refreshBest() { const b = A.best(CFG.slug); if (b) { const el = $('bestLine'); el.textContent = 'Your best so far: ' + b + '/' + MAXLEN; el.hidden = false; } }
refreshBest();
window.__sw = { info: () => ({ i, score, streak, cur, ROUND, answered }), answer };

</script>
</body>
</html>
