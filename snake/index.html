<style>
:root {
  /* Layout: a column with a score bar on top, the playfield in the middle, optional on-screen buttons under it and a credit line at the bottom. */
  --bg: #0a1a12;
  --panel: #0f2a1c;
  --ink: #e8ffe8;
  --mute: #5fa878;
  --accent: #7dff7a;
  --accent2: #1f6b3a;
  --pix: "Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 12px/1.5 var(--pix); overflow: hidden; overscroll-behavior: none; }
#app { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg); max-width: 100%; }
.hud { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; }
.score b { display: block; font-weight: 400; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5); }
.score small { display: block; margin-top: 6px; font-size: 9px; color: var(--mute); }
#snd { font: 400 10px/1 var(--pix); color: var(--ink); background: transparent; border: 2px solid var(--mute); border-radius: 0; min-height: 40px; padding: 0 12px; cursor: pointer; }
#snd:focus-visible, .pbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#stage { position: relative; flex: 1 1 auto; min-height: 0; margin: 0 12px; background: var(--panel); border: 3px solid var(--mute); box-shadow: 0 0 0 3px var(--bg), 0 0 24px rgba(0, 0, 0, 0.6) inset; overflow: hidden; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.12) 3px); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.pad { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px 12px 2px; touch-action: none; }
.pbtn { flex: 1 1 0; max-width: 120px; min-height: 56px; font: 400 14px/1 var(--pix); color: var(--ink); background: var(--panel); border: 3px solid var(--mute); border-radius: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.pbtn:active, .pbtn.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); background: var(--accent2); }
.credit { flex: 0 0 auto; text-align: center; font-size: 8px; color: var(--mute); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.credit a { color: var(--ink); }
.panel { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 20px; background: rgba(0, 0, 0, 0.62); cursor: pointer; }
.panel h1 { margin: 0; font-weight: 400; font-size: clamp(22px, 7vw, 40px); line-height: 1.2; color: var(--accent); text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6); }
.panel p { margin: 0; max-width: 34ch; font-size: 10px; line-height: 1.9; color: var(--ink); }
.panel .big { font-size: 26px; color: var(--ink); }
.btn { margin-top: 6px; padding: 14px 20px; background: var(--accent); color: #111; font-size: 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.55; } }
@media (max-width: 520px) { .score b { font-size: 18px; } }
@media (hover: hover) and (pointer: fine) { .pad.touch-only { display: none; } }

<body>
<main id="app">
  <div class="hud">
    <div class="score"><b id="sc">0</b><small id="sub">BEST 0</small></div>
    <button id="snd" type="button" aria-pressed="true">SOUND ON</button>
  </div>
  <div id="stage">
    <canvas id="game" aria-label="Snake. Swipe or use the arrow keys to steer the snake."></canvas>
    
    <div class="panel" id="pReady"><h1>SNAKE</h1><p>Swipe or use the arrow keys to steer. Eat the candy, grow long, and do not hit the walls or yourself.</p><span class="btn">TAP TO START</span></div>
    <div class="panel" id="pOver" hidden><p class="big" id="oHead">GAME OVER</p><h1 id="oScore">0</h1><p id="oSub">BEST 0</p><span class="btn">TAP TO PLAY AGAIN</span></div>
  </div>
  <div class="pad " id="pad" hidden></div>
  <div class="credit">Made by <a href="https://phellep.vercel.app/">Phellep Shapopi</a></div>
</main>

<script>

const R = window.R = {};
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
R.$ = $; R.clamp = clamp; R.rnd = Math.random; R.TAU = Math.PI * 2;
R.canvas = $('game'); R.g = R.canvas.getContext('2d');
R.W = 1; R.H = 1; R.dpr = 1; R.state = 'ready'; R.time = 0;
R.opts = { key: 'snake', lowerBetter: false, fmt: (n) => String(n), overHead: 'GAME OVER' };
R.best = null; R.sound = window.Toybox ? Toybox.sound : true; R.score = 0;
Object.defineProperty(R, 'reduced', { get: () => !!(window.Toybox ? Toybox.reduced : (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) });
R.loop = null; R.onStart = null; R.onResize = null; R.onKey = null; R.onPointer = {};
try { const v = localStorage.getItem('retro.' + R.opts.key + '.best'); if (v !== null) R.best = +v; } catch (e) {}

/* ---- audio: tiny synth so no files are needed ---- */
let ac = null, master = null, nbuf = null;

/* ---- score, best, panels ---- */
R.setScore = (n) => { R.score = n; $('sc').textContent = R.opts.fmt(n); };
R.setSub = (t) => { $('sub').textContent = t; };
const showBest = () => { $('sub').textContent = 'BEST ' + (R.best === null ? '-' : R.opts.fmt(R.best)); };
R.showBest = showBest;
R.start = () => {
  R.audio(); if (ac && ac.state === 'suspended') ac.resume();
  R.state = 'play'; $('pReady').hidden = true; $('pOver').hidden = true; R.setScore(0); showBest();
  if (R.onStart) R.onStart();
};
R.gameOver = (score, head) => {
  if (window.Toybox) Toybox.setResult(document.title, score);
  if (R.state === 'over') return; R.state = 'over'; R.overAt = R.time;
  const s = score === undefined ? R.score : score; let isNew = false;
  if (R.best === null || (R.opts.lowerBetter ? s < R.best : s > R.best)) { if (s > 0 || R.opts.lowerBetter) { R.best = s; isNew = true; try { localStorage.setItem('retro.' + R.opts.key + '.best', String(s)); } catch (e) {} } }
  $('oHead').textContent = head || R.opts.overHead; $('oScore').textContent = R.opts.fmt(s); $('oSub').textContent = isNew ? 'NEW BEST!' : 'BEST ' + (R.best === null ? '-' : R.opts.fmt(R.best)); $('pOver').hidden = false; showBest();
};
$('pReady').addEventListener('pointerdown', (e) => { e.preventDefault(); R.start(); });
$('pOver').addEventListener('pointerdown', (e) => { e.preventDefault(); if (R.time - R.overAt > 0.5) R.start(); });
$('snd').addEventListener('click', (e) => { R.sound = !R.sound; e.currentTarget.setAttribute('aria-pressed', String(R.sound)); e.currentTarget.textContent = R.sound ? 'SOUND ON' : 'SOUND OFF'; if (window.Toybox) Toybox.setSound(R.sound); if (R.sound) R.audio(); });
{ const b = $('snd'); b.setAttribute('aria-pressed', String(R.sound)); b.textContent = R.sound ? 'SOUND ON' : 'SOUND OFF'; }

/* ---- on-screen buttons: R.pad([{label, key, hold, on}]) ---- */
R.pad = (btns, touchOnly) => {
  const p = $('pad'); p.innerHTML = ''; p.hidden = !btns || !btns.length; if (touchOnly) p.classList.add('touch-only');
  (btns || []).forEach((b) => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'pbtn'; el.textContent = b.label; if (b.aria) el.setAttribute('aria-label', b.aria);
    let timer = null; const fire = () => { if (R.state === 'play' || b.always) { if (b.on) b.on(); } };
    const stop = () => { el.classList.remove('on'); clearInterval(timer); timer = null; if (b.up) b.up(); };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (err) {} el.classList.add('on'); fire(); if (b.hold) { clearInterval(timer); timer = setInterval(fire, b.hold); } });
    el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop); el.addEventListener('lostpointercapture', stop);
    p.appendChild(el);

/* ---- sizing, input, loop ---- */
R.resize = () => {
  const c = R.canvas, r = c.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;

const loc = (e) => { const r = R.canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
R.canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); try { R.canvas.setPointerCapture(e.pointerId); } catch (err) {} R.audio(); const p = loc(e); if (R.onPointer.down) R.onPointer.down(p[0], p[1], e); });

const up = (e) => { const p = loc(e); if (R.onPointer.up) R.onPointer.up(p[0], p[1], e); };
R.canvas.addEventListener('pointerup', up); R.canvas.addEventListener('pointercancel', up);
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && R.state !== 'play') { if (R.state === 'ready' || R.time - R.overAt > 0.5) { R.start(); return; } }
  if (R.onKey) R.onKey(e);
});
let last = 0;
function frame(ts) {
  const t = ts / 1000; let dt = t - last; last = t; if (dt > 0.05 || dt <= 0) dt = 0.016; R.time += dt;
  R.g.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);

  requestAnimationFrame(frame);
}
R.run = () => { R.resize(); if (window.ResizeObserver) new ResizeObserver(R.resize).observe(R.canvas); else window.addEventListener('resize', R.resize); showBest(); last = performance.now() / 1000; requestAnimationFrame(frame); };

})();

(() => {
'use strict';
const {g, clamp, rnd, TAU} = R;
let cell = 20, cols = 10, rows = 10, ox = 0, oy = 0;
let snake = [], dir = [1, 0], queue = [], food = null, gold = null, acc = 0, step = 0.14, parts = [], score = 0, dead = 0, flash = 0;
const DIRS = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

function layout() {
  cell = clamp(Math.floor(Math.min(R.W, R.H) / 15), 16, 34);
  cols = Math.max(8, Math.floor(R.W / cell)); rows = Math.max(8, Math.floor(R.H / cell));
  ox = Math.floor((R.W - cols * cell) / 2); oy = Math.floor((R.H - rows * cell) / 2);
}
function reset() {
  layout();
  const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
  snake = [[cx, cy], [cx - 1, cy], [cx - 2, cy]]; dir = [1, 0]; queue = []; score = 0; step = 0.14; acc = 0; parts = []; gold = null; dead = 0; flash = 0;
  placeFood();
}
function free(x, y) { return !snake.some((s) => s[0] === x && s[1] === y) && !(food && food[0] === x && food[1] === y) && !(gold && gold.x === x && gold.y === y); }

function turn(d) {
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (d[0] === -last[0] && d[1] === -last[1]) return; if (d[0] === last[0] && d[1] === last[1]) return;
  if (queue.length < 2) queue.push(d);
}
function burst(x, y, col, n) { for (let i = 0; i < n; i++) { const a = rnd() * TAU, s = 40 + rnd() * 160; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.5, c: col }); } }
const CANDY = ['#ff5d8f', '#ffb627', '#3ddc97', '#35a7ff', '#a66bff', '#ff7a3d'];

function tick() {
  if (queue.length) dir = queue.shift();
  const h = snake[0], nx = h[0] + dir[0], ny = h[1] + dir[1];
  if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || snake.some((s, i) => i < snake.length - 1 && s[0] === nx && s[1] === ny)) { die(); return; }
  snake.unshift([nx, ny]);
  let ate = false;
  if (food && nx === food[0] && ny === food[1]) { ate = true; score += 1; burst(ox + (nx + 0.5) * cell, oy + (ny + 0.5) * cell, CANDY[food[2]], 12); R.beep(520, 0.08, 'square', 0.14, 900); placeFood(); if (score % 5 === 0 && !gold) { const p = place(); if (p) gold = { x: p[0], y: p[1], t: 7 }; } }
  else if (gold && nx === gold.x && ny === gold.y) { ate = true; score += 5; burst(ox + (nx + 0.5) * cell, oy + (ny + 0.5) * cell, '#ffd23f', 20); R.beep(700, 0.16, 'square', 0.16, 1400); gold = null; }

}

  g.fillStyle = '#123322'; for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if ((x + y) % 2 === 0) g.fillRect(ox + x * cell, oy + y * cell, cell, cell);
  g.strokeStyle = 'rgba(125,255,122,0.35)'; g.lineWidth = 2; g.strokeRect(ox - 1, oy - 1, cols * cell + 2, rows * cell + 2);

  const n = snake.length;
  for (let i = n - 1; i >= 0; i--) {
    const s = snake[i], x = ox + s[0] * cell, y = oy + s[1] * cell, k = 1 - (i / n) * 0.45, pad = i === 0 ? 1 : 2;
    g.fillStyle = dead ? '#c4453d' : 'rgb(' + ((70 + 55 * k) | 0) + ',' + ((200 + 55 * k) | 0) + ',' + ((90 + 32 * k) | 0) + ')';

      for (const sd of [-1, 1]) { const ax = cx + ex * cell * 0.12 + px * sd * e * 1.1, ay = cy + ey * cell * 0.12 + py * sd * e * 1.1; g.fillStyle = '#fff'; g.beginPath(); g.arc(ax, ay, e * 0.85, 0, TAU); g.fill(); g.fillStyle = '#10261a'; g.beginPath(); g.arc(ax + ex * e * 0.3, ay + ey * e * 0.3, e * 0.42, 0, TAU); g.fill(); }
    }

R.debug({ info: () => ({ score, len: snake.length, cols, rows, state: R.state, dir }), snake: () => snake, food: () => food, turn, DIRS, tick });
R.run();

})();
