<style>
:root {
  /* Layout: a dark night window fills the screen, a slim tray of three buttons sits underneath. */
  --bg: #05070d;
  --panel: #0c101b;
  --line: #1d2436;
  --ink: #e8f0ff;
  --mute: #7f8aa6;
  --accent: #7fd6ff;
  --display: "Syne", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.3 var(--mono); overflow: hidden; overscroll-behavior: none; }
#app { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; }
#win { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.title { position: absolute; left: 16px; top: 12px; pointer-events: none; }
h1 { margin: 0; font: 700 24px/1 var(--display); letter-spacing: 0.02em; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); }
#hint { margin: 5px 0 0; color: var(--mute); font-size: 12px; transition: opacity 0.8s; text-shadow: 0 1px 8px #000; }
.tray { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; }
button { font: 400 14px/1 var(--mono); color: var(--ink); background: #141a2b; border: 1px solid var(--line); border-radius: 999px; min-height: 40px; padding: 0 16px; cursor: pointer; }
button:hover { background: #1b2340; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.credit { color: var(--mute); font-size: 12px; }
.credit a { color: var(--ink); }
@media (max-width: 560px) { .credit { flex-basis: 100%; text-align: center; } }
</style>

<style>html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; background: #05070d; }</style>

<body>
<main id="app">
  <div class="stage">
    <canvas id="win" aria-label="A dark window with glass panes. Click or tap to crack the glass. Hold to hit harder."></canvas>
    <div class="title"><h1>Shatter</h1><p id="hint">Tap to crack the glass. Hold to hit harder.</p></div>
  </div>
  <div class="tray">
    <button id="bSound" type="button" aria-pressed="true">Sound on</button>
    <button id="bSlow" type="button" aria-pressed="false">Slow motion</button>
    <button id="bNew" type="button">New window</button>
    <span class="credit">Made by <a href="https://phellep.vercel.app/">Phellep Shapopi</a></span>
  </div>
</main>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('win'), g = cv.getContext('2d');
const TAU = Math.PI * 2, rnd = Math.random;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
let W = 1, H = 1, dpr = 1, U = 1;
let shards = [], fallers = [], flashes = [], frameR = null, panes = [], bg = null;
let simT = 0, lastT = 0, slow = false, soundOn = true, hits = 0, hintT = 0, tinkleBudget = 0;
const ptr = { x: 0, y: 0, down: false, t0: 0 };

/* ---------- polygon helpers ---------- */
function clip(poly, a, b, c) {
  const out = [], n = poly.length;
  for (let i = 0; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n], dp = a * p[0] + b * p[1] - c, dq = a * q[0] + b * q[1] - c;
    if (dp <= 0) out.push(p);
    if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) { const t = dp / (dp - dq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
  }
  return out;
}
function area(poly) { let s = 0; for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; s += p[0] * q[1] - q[0] * p[1]; } return s / 2; }
function mk(poly) {
  let ar = area(poly), cx = 0, cy = 0, minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length], f = p[0] * q[1] - q[0] * p[1];
    cx += (p[0] + q[0]) * f; cy += (p[1] + q[1]) * f;
    minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]);
  }
  if (Math.abs(ar) > 1e-3) { cx /= 6 * ar; cy /= 6 * ar; } else { cx = (minx + maxx) / 2; cy = (miny + maxy) / 2; }
  return { p: poly, ar: Math.abs(ar), cx, cy, x0: minx, y0: miny, x1: maxx, y1: maxy, revealAt: 0, fallAt: Infinity, ix: 0, iy: 0, glint: rnd() * TAU, a: 0.05 + rnd() * 0.07 };
}

/* ---------- the window ---------- */
function buildWindow() {
  shards = []; fallers = []; flashes = []; hits = 0;
  const m = Math.max(14, U * 0.05), x0 = m, y0 = Math.max(56, m), x1 = W - m, y1 = H - m * 0.7;
  const land = (x1 - x0) > (y1 - y0) * 1.1, cols = land ? 3 : 2, rows = land ? 2 : 3;
  const fw = Math.max(10, U * 0.028), mw = fw * 0.7;
  frameR = { x0, y0, x1, y1, fw, mw };
  panes = [];
  const pw = (x1 - x0 - 2 * fw - (cols - 1) * mw) / cols, ph = (y1 - y0 - 2 * fw - (rows - 1) * mw) / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const px = x0 + fw + c * (pw + mw), py = y0 + fw + r * (ph + mw);
    panes.push([px, py, pw, ph]);
    shards.push(mk([[px, py], [px + pw, py], [px + pw, py + ph], [px, py + ph]]));
  }
}
function buildBg() {
  bg = document.createElement('canvas'); bg.width = Math.round(W * dpr); bg.height = Math.round(H * dpr);
  const b = bg.getContext('2d'); b.scale(dpr, dpr);
  const gr = b.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#060912'); gr.addColorStop(0.6, '#0b1020'); gr.addColorStop(1, '#171325');
  b.fillStyle = gr; b.fillRect(0, 0, W, H);
  let seed = 7; const r2 = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const cols = [[255, 170, 80], [90, 200, 225], [235, 95, 165], [255, 235, 200], [120, 140, 255]];
  for (let i = 0; i < 34; i++) {
    const x = r2() * W, y = H * (0.25 + r2() * 0.7), rad = U * (0.03 + r2() * 0.11), c = cols[(r2() * cols.length) | 0], a = 0.1 + r2() * 0.22;
    const rg = b.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${a})`); rg.addColorStop(0.75, `rgba(${c[0]},${c[1]},${c[2]},${a * 0.6})`); rg.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    b.fillStyle = rg; b.beginPath(); b.arc(x, y, rad, 0, TAU); b.fill();
  }
  // a cold moon glow so the glass has something to catch
  const mg = b.createRadialGradient(W * 0.78, H * 0.16, 0, W * 0.78, H * 0.16, U * 0.7);
  mg.addColorStop(0, 'rgba(150,190,255,0.22)'); mg.addColorStop(1, 'rgba(150,190,255,0)');
  b.fillStyle = mg; b.fillRect(0, 0, W, H);
}
function resize() {
  const r = cv.getBoundingClientRect(); if (r.width < 10) return;
  const nw = Math.round(r.width), nh = Math.round(r.height);
  if (nw === W && nh === H) return;
  W = nw; H = nh; dpr = Math.min(2, window.devicePixelRatio || 1); U = Math.min(W, H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  buildBg();
  if (!hits) buildWindow();
}

/* ---------- breaking ---------- */
function makeSeeds(px, py, R) {
  // rings that share their spoke angles give straight radial cracks joined by ring-shaped ones, like real glass
  const rings = [[0.15, 7], [0.34, 7], [0.58, 7], [0.92, 14], [1.4, 14], [2.0, 14], [2.8, 14], [3.6, 14], [4.6, 14], [6, 14], [9, 14]], seeds = [[px, py]];
  const a0 = rnd() * TAU;
  for (const [k, n] of rings) {
    for (let m = 0; m < n; m++) {
      const a = a0 + (m + (rnd() - 0.5) * 0.16) * TAU / n, rr = R * k * (1 + (rnd() - 0.5) * 0.12);
      seeds.push([px + Math.cos(a) * rr, py + Math.sin(a) * rr]);
    }
  }
  return seeds;
}
function cellsFor(seeds) {
  const box = [[-80, -80], [W + 80, -80], [W + 80, H + 80], [-80, H + 80]], cells = [];
  for (let i = 0; i < seeds.length; i++) {
    const si = seeds[i], order = [];
    for (let j = 0; j < seeds.length; j++) if (j !== i) order.push([Math.hypot(seeds[j][0] - si[0], seeds[j][1] - si[1]), j]);
    order.sort((a, b) => a[0] - b[0]);
    let cell = box;
    for (const [, j] of order) {
      const sj = seeds[j];
      cell = clip(cell, sj[0] - si[0], sj[1] - si[1], (sj[0] * sj[0] + sj[1] * sj[1] - si[0] * si[0] - si[1] * si[1]) / 2);
      if (cell.length < 3) break;
    }
    if (cell.length >= 3) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      cell.forEach((p) => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
      cells.push({ poly: cell, x0, y0, x1, y1, s: Math.sign(area(cell)) || 1 });
    }
  }
  return cells;
}
function intersect(poly, cell) {
  let out = poly; const c = cell.poly, s = cell.s;
  for (let i = 0; i < c.length && out.length >= 3; i++) {
    const u = c[i], v = c[(i + 1) % c.length], A = -(v[1] - u[1]), B = v[0] - u[0], C = (v[1] - u[1]) * u[0] - (v[0] - u[0]) * u[1];
    out = clip(out, -s * A, -s * B, s * C);
  }
  return out;
}

const SPEED = () => U * 2.4;
function impact(px, py, power) {
  hits++;
  const R = U * (0.05 + 0.2 * power), reach = R * 2.6, speed = SPEED();
  const seeds = makeSeeds(px, py, R), cells = cellsFor(seeds), next = [];
  let broke = 0;
  for (const S of shards) {
    // does this shard come near the blast?
    const dx = Math.max(S.x0 - px, 0, px - S.x1), dy = Math.max(S.y0 - py, 0, py - S.y1);
    if (Math.hypot(dx, dy) > reach || S.fallAt !== Infinity) { next.push(S); continue; }
    let pieces = [];
    if (S.ar < R * R * 0.05) pieces = [S];
    else for (const c of cells) {
      if (c.x1 < S.x0 || c.x0 > S.x1 || c.y1 < S.y0 || c.y0 > S.y1) continue;
      const q = intersect(S.p, c);
      if (q.length >= 3 && Math.abs(area(q)) > 14) pieces.push(mk(q));
    }
    for (const P of pieces) {
      const d = Math.hypot(P.cx - px, P.cy - py);
      P.ix = px; P.iy = py; P.revealAt = simT + d / speed;
      if (d < R || (d < R * 1.8 && rnd() < 0.55 * (1 - (d - R) / (R * 0.8)))) { P.fallAt = simT + d / speed + 0.04 + rnd() * 0.16; broke++; }
      next.push(P);
    }
  }
  shards = next;
  flashes.push({ x: px, y: py, t: simT, r: R * 3 });
  crackSound(power, broke);
}

function releaseShard(S) {
  const d = Math.hypot(S.cx - S.ix, S.cy - S.iy) || 1, near = 1 - clamp(d / (U * 0.4), 0, 1);
  const sp = U * (0.12 + 0.7 * near) * (0.5 + rnd());
  let vx = (S.cx - S.ix) / d * sp + (rnd() - 0.5) * U * 0.08, vy = (S.cy - S.iy) / d * sp * 0.5 - rnd() * U * 0.12;
  const rel = S.p.map((p) => [p[0] - S.cx, p[1] - S.cy]);
  fallers.push({ q: rel, cx: S.cx, cy: S.cy, ox: 0, oy: 0, vx, vy, rot: 0, vr: (rnd() - 0.5) * 7, glint: S.glint, size: Math.sqrt(S.ar), a: S.a });
  if (tinkleBudget > 0) { tinkleBudget--; tinkle(); }
}

/* ---------- sound ---------- */
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (ac || !soundOn) return ac;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
  return ac;
}
function crackSound(power, n) {
  if (!soundOn || !audio()) return; if (ac.state === 'suspended') ac.resume();
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500 + 1200 * (1 - power);
  const ng = ac.createGain(); ng.gain.setValueAtTime(0.7 * (0.5 + power), t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.09 + 0.12 * power);
  s.connect(hp); hp.connect(ng); ng.connect(master); s.start(t); s.stop(t + 0.3);
  const o = ac.createOscillator(); o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.14);
  const og = ac.createGain(); og.gain.setValueAtTime(0.55 * (0.4 + power), t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.2);
  tinkleBudget = Math.min(26, 6 + n);
}
function tinkle() {
  if (!soundOn || !ac) return;
  const t = ac.currentTime + rnd() * 0.02, o = ac.createOscillator(), gn = ac.createGain(), f = 1800 + rnd() * 4800;
  o.type = 'sine'; o.frequency.value = f;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.06, t + 0.004); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.16 + rnd() * 0.2);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + 0.4);
  const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.frequency.value = f * 2.76; g2.gain.setValueAtTime(0.02, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 0.12);
}

/* ---------- input ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', (e) => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = pos(e); ptr.x = p[0]; ptr.y = p[1]; ptr.down = true; ptr.t0 = performance.now();
  if (soundOn) audio(); if (ac && ac.state === 'suspended') ac.resume();
  clearTimeout(hintT); hintT = setTimeout(() => { $('hint').style.opacity = 0; }, 3500);
});
cv.addEventListener('pointermove', (e) => { const p = pos(e); ptr.x = p[0]; ptr.y = p[1]; });
function release() {
  if (!ptr.down) return; ptr.down = false;
  const pw = clamp((performance.now() - ptr.t0) / 900, 0, 1);
  impact(ptr.x, ptr.y, Math.max(0.22, pw));
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { ptr.down = false; });
$('bSound').addEventListener('click', (e) => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn) audio(); });
$('bSlow').addEventListener('click', (e) => { slow = !slow; e.currentTarget.setAttribute('aria-pressed', String(slow)); });
$('bNew').addEventListener('click', () => { buildWindow(); flashes.push({ x: W / 2, y: H / 2, t: simT, r: U, soft: true }); });

/* ---------- drawing ---------- */
function path(poly) { g.beginPath(); g.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < poly.length; i++) g.lineTo(poly[i][0], poly[i][1]); g.closePath(); }
function drawFrame() {
  const f = frameR; if (!f) return;
  g.save(); g.beginPath(); g.rect(f.x0 - 4, f.y0 - 4, f.x1 - f.x0 + 8, f.y1 - f.y0 + 8);
  panes.forEach((p) => g.rect(p[0], p[1], p[2], p[3]));
  g.fillStyle = '#0a0806'; g.fill('evenodd');
  g.lineWidth = 1.5; g.strokeStyle = 'rgba(190,150,110,0.28)';
  panes.forEach((p) => g.strokeRect(p[0] - 0.5, p[1] - 0.5, p[2] + 1, p[3] + 1));
  g.restore();
}
function draw(now) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.drawImage(bg, 0, 0, W, H);
  // the standing glass: a shared cold sheen plus each shard's own tint
  const sheen = g.createLinearGradient(0, 0, W, H); sheen.addColorStop(0, 'rgba(190,225,255,0.11)'); sheen.addColorStop(0.35, 'rgba(190,225,255,0.02)'); sheen.addColorStop(0.55, 'rgba(255,255,255,0.09)'); sheen.addColorStop(1, 'rgba(190,225,255,0.03)');
  for (const S of shards) { path(S.p); g.fillStyle = sheen; g.fill(); if (S.revealAt) { g.fillStyle = 'rgba(200,230,255,' + S.a.toFixed(3) + ')'; g.fill(); } }
  g.lineJoin = 'round';
  for (const S of shards) {
    if (!S.revealAt) continue;
    const k = clamp((simT - S.revealAt) / 0.08, 0, 1); if (k <= 0) continue;
    path(S.p); g.strokeStyle = 'rgba(0,0,0,' + (0.55 * k).toFixed(3) + ')'; g.lineWidth = 3; g.stroke();
    g.strokeStyle = 'rgba(225,240,255,' + (0.6 * k).toFixed(3) + ')'; g.lineWidth = 1.1; g.stroke();
  }
  drawFrame();
  for (const F of fallers) {
    g.save(); g.translate(F.cx + F.ox, F.cy + F.oy); g.rotate(F.rot); path(F.q);
    const gl = Math.max(0, Math.sin(F.rot * 2 + F.glint)), fa = 0.12 + F.a + gl * 0.5;
    g.fillStyle = 'rgba(210,235,255,' + Math.min(0.75, fa).toFixed(3) + ')'; g.fill();
    g.lineJoin = 'round'; g.strokeStyle = 'rgba(255,255,255,' + (0.5 + gl * 0.5).toFixed(3) + ')'; g.lineWidth = 1.2; g.stroke();
    g.restore();
  }
  for (const f of flashes) {
    const a = 1 - (simT - f.t) / (f.soft ? 0.7 : 0.28); if (a <= 0) continue;
    const rg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); rg.addColorStop(0, 'rgba(255,255,255,' + (0.55 * a).toFixed(3) + ')'); rg.addColorStop(1, 'rgba(160,210,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill();
  }
  if (ptr.down) {
    const pw = Math.max(0.22, clamp((now - ptr.t0) / 900, 0, 1)), R = U * (0.05 + 0.2 * pw);
    g.strokeStyle = 'rgba(160,215,255,0.75)'; g.lineWidth = 2; g.beginPath(); g.arc(ptr.x, ptr.y, R, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(160,215,255,0.35)'; g.beginPath(); g.arc(ptr.x, ptr.y, R * 2.6, 0, TAU); g.setLineDash([4, 8]); g.stroke(); g.setLineDash([]);
  }
}

/* ---------- loop ---------- */
function update(dt) {
  simT += dt;
  const G = U * 2.6;
  if (shards.some((s) => s.fallAt <= simT)) {
    const keep = [];
    for (const S of shards) { if (S.fallAt <= simT) releaseShard(S); else keep.push(S); }
    shards = keep;
  }
  for (const F of fallers) { F.vy += G * dt; F.vx *= 1 - 0.15 * dt; F.ox += F.vx * dt; F.oy += F.vy * dt; F.rot += F.vr * dt; }

}
function frame(ts) {

}

requestAnimationFrame(frame);
})();
